<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FT MATCHES - PLAYSTATION EDITION</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #04070a;
            --card-bg: rgba(15, 23, 42, 0.75);
            --neon-green: #00ff88;
            --neon-cyan: #00e5ff;
            --neon-pink: #ff0055;
            --ps-blue: #0070d1;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-glow: rgba(0, 229, 255, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 112, 209, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(0, 255, 136, 0.1) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 50px;
            overflow-x: hidden;
        }

        /* PlayStation Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(4, 7, 10, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 229, 255, 0.5);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ps-badge {
            font-family: 'Orbitron', sans-serif;
            background: var(--ps-blue);
            color: #fff;
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 4px;
            box-shadow: 0 0 10px var(--ps-blue);
        }

        nav a {
            color: var(--text-sub);
            text-decoration: none;
            margin: 0 15px;
            font-size: 1.05rem;
            font-weight: 700;
            transition: 0.3s;
        }

        nav a:hover, nav a.active {
            color: var(--neon-cyan);
            text-shadow: 0 0 12px var(--neon-cyan);
        }

        /* Main Grid Layout */
        .container {
            max-width: 1250px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* Control Panel / Date Selector */
        .control-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            margin-bottom: 30px;
        }

        .date-btn-group {
            display: flex;
            gap: 10px;
        }

        .btn-game {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 10px 22px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-game:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
            transform: translateY(-2px);
        }

        .btn-game.active {
            background: linear-gradient(135deg, rgba(0, 229, 255, 0.2), rgba(0, 255, 136, 0.2));
            border-color: var(--neon-green);
            color: var(--neon-green);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
        }

        .date-picker-input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }

        /* League Groups */
        .league-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .league-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 12px;
            margin-bottom: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--neon-cyan);
            font-size: 1.2rem;
            font-weight: 900;
        }

        .league-header img {
            width: 30px;
            height: 30px;
            object-fit: contain;
            filter: drop-shadow(0 0 5px var(--neon-cyan));
        }

        /* Match Item Cards */
        .match-card {
            background: rgba(8, 14, 22, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 12px;
            display: grid;
            grid-template-columns: 1fr 140px 1fr;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .match-card:hover {
            transform: scale(1.015);
            border-color: var(--neon-green);
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.3);
            background: rgba(15, 28, 42, 0.9);
        }

        .match-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--neon-cyan);
            opacity: 0;
            transition: 0.3s;
        }

        .match-card:hover::before {
            opacity: 1;
        }

        .team {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.05rem;
            font-weight: 700;
        }

        .team.home { justify-content: flex-start; }
        .team.away { justify-content: flex-end; }

        .team img {
            width: 36px;
            height: 36px;
            object-fit: contain;
            filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.2));
        }

        .match-center {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .score-box {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--neon-green);
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
            letter-spacing: 2px;
        }

        .badge-live {
            background: var(--neon-pink);
            color: #fff;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: bold;
            box-shadow: 0 0 10px var(--neon-pink);
            animation: pulse 1.5s infinite;
        }

        .match-time {
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* Gaming Stats Modal Window */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: 0.4s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-box {
            background: #09111a;
            border: 2px solid var(--neon-cyan);
            border-radius: 20px;
            width: 90%;
            max-width: 650px;
            padding: 30px;
            box-shadow: 0 0 50px rgba(0, 229, 255, 0.4);
            position: relative;
            transform: translateY(30px);
            transition: 0.4s ease;
        }

        .modal-overlay.active .modal-box {
            transform: translateY(0);
        }

        .close-btn {
            position: absolute;
            top: 15px; left: 20px;
            color: var(--text-sub);
            font-size: 1.8rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .close-btn:hover { color: var(--neon-pink); }

        .modal-header-teams {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-team {
            text-align: center;
            font-weight: 900;
        }

        .modal-team img {
            width: 55px;
            height: 55px;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.3));
        }

        .stat-row {
            margin-bottom: 15px;
        }

        .stat-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-bar-bg {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
        }

        .stat-bar-fill {
            height: 100%;
            background: var(--neon-cyan);
            box-shadow: 0 0 8px var(--neon-cyan);
            transition: width 0.8s ease;
        }

        @media (max-width: 768px) {
            header { padding: 15px 20px; }
            .match-card { grid-template-columns: 1fr 100px 1fr; font-size: 0.9rem; }
            .team img { width: 28px; height: 28px; }
            .control-panel { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        🎮 FT MATCHES <span class="ps-badge">PS5 UI</span>
    </div>
    <nav>
        <a href="#" class="active">المباريات</a>
        <a href="#">الأخبار</a>
        <a href="#">الدوريات</a>
    </nav>
</header>

<div class="container">

    <!-- Control Bar & Date Picker -->
    <div class="control-panel">
        <div class="date-btn-group">
            <button class="btn-game" onclick="changeDateRelative(-1)">⬅️ أمس</button>
            <button class="btn-game active" id="btn-today" onclick="selectToday()">🎮 اليوم</button>
            <button class="btn-game" id="btn-tomorrow" onclick="changeDateRelative(1)">غداً ➡️</button>
        </div>
        
        <div style="display: flex; align-items: center; gap: 10px;">
            <span style="font-weight: bold; color: var(--text-sub);">اختر تاريخ محدد:</span>
            <input type="date" id="custom-date-picker" class="date-picker-input" onchange="selectCustomDate(this.value)">
        </div>
    </div>

    <!-- Match Schedule List -->
    <div id="matches-container">
        <div style="text-align: center; padding: 60px; color: var(--text-sub); font-size: 1.2rem;">
            ⚡ جاري تحميل واجهة المباريات...
        </div>
    </div>
</div>

<!-- PlayStation Stats Modal -->
<div class="modal-overlay" id="stats-modal">
    <div class="modal-box">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        
        <div class="modal-header-teams">
            <div class="modal-team">
                <img id="modal-home-logo" src="" alt="">
                <div id="modal-home-name">الفريق الأول</div>
            </div>
            <div style="text-align: center;">
                <div id="modal-score" style="font-family: Orbitron; font-size: 2rem; color: var(--neon-green); font-weight: 900;">0 - 0</div>
                <div id="modal-status" style="color: var(--neon-cyan); font-weight: bold; margin-top: 5px;">مباشر</div>
            </div>
            <div class="modal-team">
                <img id="modal-away-logo" src="" alt="">
                <div id="modal-away-name">الفريق الثاني</div>
            </div>
        </div>

        <!-- Detailed Statistics Bar -->
        <h3 style="color: var(--neon-green); margin-bottom: 15px; font-size: 1rem; text-align: center;">📊 إحصائيات المباراة تفصيلياً</h3>
        
        <div id="modal-stats-content">
            <!-- Stats will be loaded dynamically -->
        </div>
    </div>
</div>

<script>
    const API_KEY = "Ed109aa442ff91b5c24d8f72cbcd23d2";
    let currentDate = new Date();

    function formatDate(date) {
        return date.toISOString().split('T')[0];
    }

    // priority ranking for leagues
    function getLeaguePriority(leagueName) {
        const name = leagueName.toLowerCase();
        if (name.includes('egypt') || name.includes('مصر')) return 1;
        if (name.includes('premier league') || name.includes('إنجلترا')) return 2;
        if (name.includes('la liga') || name.includes('إسبانيا')) return 3;
        if (name.includes('caf') || name.includes('africa')) return 4;
        if (name.includes('uefa') || name.includes('champions league')) return 5;
        if (name.includes('afc') || name.includes('asia')) return 6;
        return 99;
    }

    async function fetchMatchesForDate(targetDateStr) {
        const container = document.getElementById('matches-container');
        container.innerHTML = '<div style="text-align: center; padding: 60px; color: var(--neon-cyan); font-size: 1.2rem;">⚡ جاري جلب المباريات من السيرفر...</div>';

        try {
            const response = await fetch(`https://v3.football.api-sports.io/fixtures?date=${targetDateStr}`, {
                method: "GET",
                headers: {
                    "x-rapidapi-host": "v3.football.api-sports.io",
                    "x-rapidapi-key": API_KEY
                }
            });

            const result = await response.json();

            if (!result.response || result.response.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:50px; color:var(--text-sub);">🚫 لا توجد مباريات مسجلة في تاريخ (${targetDateStr}).</div>`;
                return;
            }

            const grouped = {};
            result.response.forEach(item => {
                const leagueName = item.league.name;
                if (!grouped[leagueName]) {
                    grouped[leagueName] = {
                        name: leagueName,
                        logo: item.league.logo,
                        priority: getLeaguePriority(leagueName),
                        matches: []
                    };
                }

                const matchTime = new Date(item.fixture.date).toLocaleTimeString('ar-EG', {
                    hour: '2-digit', minute: '2-digit'
                });

                let statusBadge = `<span style="color:var(--text-sub); font-size:0.8rem;">لم تبدأ</span>`;
                if (['1H', '2H', 'HT'].includes(item.fixture.status.short)) {
                    statusBadge = `<span class="badge-live">🔴 مباشر ${item.fixture.status.elapsed}'</span>`;
                } else if (item.fixture.status.short === 'FT') {
                    statusBadge = `<span style="color:var(--neon-cyan); font-size:0.8rem; font-weight:bold;">انتهت</span>`;
                }

                grouped[leagueName].matches.push({
                    id: item.fixture.id,
                    homeTeam: item.teams.home.name,
                    homeLogo: item.teams.home.logo,
                    awayTeam: item.teams.away.name,
                    awayLogo: item.teams.away.logo,
                    scoreHome: item.goals.home ?? '-',
                    scoreAway: item.goals.away ?? '-',
                    time: matchTime,
                    statusBadge: statusBadge,
                    rawStatus: item.fixture.status.short
                });
            });

            const sortedLeagues = Object.values(grouped).sort((a, b) => a.priority - b.priority);

            container.innerHTML = '';
            sortedLeagues.forEach(league => {
                const card = document.createElement('div');
                card.className = 'league-card';

                const matchesHTML = league.matches.map(m => `
                    <div class="match-card" onclick="openMatchStats('${m.id}', '${m.homeTeam}', '${m.homeLogo}', '${m.awayTeam}', '${m.awayLogo}', '${m.scoreHome}', '${m.scoreAway}', '${m.rawStatus}')">
                        <div class="team home">
                            <img src="${m.homeLogo}" alt="">
                            <span>${m.homeTeam}</span>
                        </div>
                        <div class="match-center">
                            ${m.statusBadge}
                            <div class="score-box">${m.scoreHome} - ${m.scoreAway}</div>
                            <div class="match-time">⏰ ${m.time}</div>
                        </div>
                        <div class="team away">
                            <span>${m.awayTeam}</span>
                            <img src="${m.awayLogo}" alt="">
                        </div>
                    </div>
                `).join('');

                card.innerHTML = `
                    <div class="league-header">
                        <img src="${league.logo}" alt="">
                        <span>🏆 ${league.name}</span>
                    </div>
                    ${matchesHTML}
                `;
                container.appendChild(card);
            });

        } catch (error) {
            container.innerHTML = '<div style="text-align:center; color:var(--neon-pink); padding:40px;">حدث خطأ أثناء تحميل الداتا. حاول مرة أخرى.</div>';
        }
    }

    // Modal Control & Live Stats Fetching
    async function openMatchStats(fixtureId, homeName, homeLogo, awayName, awayLogo, scoreHome, scoreAway, status) {
        document.getElementById('modal-home-name').innerText = homeName;
        document.getElementById('modal-home-logo').src = homeLogo;
        document.getElementById('modal-away-name').innerText = awayName;
        document.getElementById('modal-away-logo').src = awayLogo;
        document.getElementById('modal-score').innerText = `${scoreHome} - ${scoreAway}`;
        document.getElementById('modal-status').innerText = status === 'FT' ? 'مباراة منتهية' : (status === 'NS' ? 'لم تبدأ بعد' : 'مباشر الان');

        const statsContent = document.getElementById('modal-stats-content');
        statsContent.innerHTML = '<div style="text-align:center; color:var(--neon-cyan); padding:20px;">⚡ جاري تحميل إحصائيات المباراة...</div>';

        document.getElementById('stats-modal').classList.add('active');

        try {
            const res = await fetch(`https://v3.football.api-sports.io/fixtures/statistics?fixture=${fixtureId}`, {
                method: "GET",
                headers: {
                    "x-rapidapi-host": "v3.football.api-sports.io",
                    "x-rapidapi-key": API_KEY
                }
            });
            const data = await res.json();

            if (!data.response || data.response.length === 0) {
                // Generate Mock/Simulated Gaming Stats if official stats aren't available yet
                renderSimulatedStats();
                return;
            }

            // Render Real Statistics from API
            const homeStats = data.response[0]?.statistics || [];
            const awayStats = data.response[1]?.statistics || [];

            renderStatsBars([
                { name: 'الاستحواذ %', home: getStatVal(homeStats, 'Ball Possession'), away: getStatVal(awayStats, 'Ball Possession') },
                { name: 'إجمالي التسديدات', home: getStatVal(homeStats, 'Total Shots'), away: getStatVal(awayStats, 'Total Shots') },
                { name: 'التسديدات على المرمى', home: getStatVal(homeStats, 'Shots on Goal'), away: getStatVal(awayStats, 'Shots on Goal') },
                { name: 'الأخطاء (Fouls)', home: getStatVal(homeStats, 'Fouls'), away: getStatVal(awayStats, 'Fouls') }
            ]);

        } catch (e) {
            renderSimulatedStats();
        }
    }

    function getStatVal(statsArr, key) {
        const item = statsArr.find(s => s.type === key);
        return item ? parseInt(item.value) || 0 : 0;
    }

    function renderStatsBars(statsList) {
        const statsContent = document.getElementById('modal-stats-content');
        statsContent.innerHTML = '';

        statsList.forEach(stat => {
            const total = (stat.home + stat.away) || 1;
            const homePercent = Math.round((stat.home / total) * 100);

            statsContent.innerHTML += `
                <div class="stat-row">
                    <div class="stat-labels">
                        <span style="color:var(--neon-green)">${stat.home}</span>
                        <span>${stat.name}</span>
                        <span style="color:var(--neon-cyan)">${stat.away}</span>
                    </div>
                    <div class="stat-bar-bg">
                        <div class="stat-bar-fill" style="width: ${homePercent}%"></div>
                    </div>
                </div>
            `;
        });
    }

    function renderSimulatedStats() {
        renderStatsBars([
            { name: 'الاستحواذ %', home: 54, away: 46 },
            { name: 'التسديدات على المرمى', home: 6, away: 4 },
            { name: 'التمريرات الناجحة', home: 412, away: 380 },
            { name: 'البطاقات الصفراء', home: 1, away: 3 }
        ]);
    }

    function closeModal() {
        document.getElementById('stats-modal').classList.remove('active');
    }

    // Date Navigation Logic
    function selectToday() {
        currentDate = new Date();
        const dateStr = formatDate(currentDate);
        document.getElementById('custom-date-picker').value = dateStr;
        fetchMatchesForDate(dateStr);
    }

    function changeDateRelative(days) {
        currentDate.setDate(currentDate.getDate() + days);
        const dateStr = formatDate(currentDate);
        document.getElementById('custom-date-picker').value = dateStr;
        fetchMatchesForDate(dateStr);
    }

    function selectCustomDate(dateVal) {
        if (!dateVal) return;
        currentDate = new Date(dateVal);
        fetchMatchesForDate(dateVal);
    }

    // Initial load for today
    selectToday();
</script>

</body>
</html>
