<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FT MATCHES - ULTIMATE PS5 EDITION</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #04070a;
            --card-bg: rgba(15, 23, 42, 0.85);
            --neon-green: #00ff88;
            --neon-cyan: #00e5ff;
            --neon-pink: #ff0055;
            --ps-blue: #0070d1;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-glow: rgba(0, 229, 255, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 112, 209, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(0, 255, 136, 0.1) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        /* PlayStation Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(4, 7, 10, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 229, 255, 0.5);
            cursor: pointer;
        }

        .ps-badge {
            font-family: 'Orbitron', sans-serif;
            background: var(--ps-blue);
            color: #fff;
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 4px;
            box-shadow: 0 0 10px var(--ps-blue);
        }

        nav a {
            color: var(--text-sub);
            text-decoration: none;
            margin: 0 15px;
            font-size: 1.05rem;
            font-weight: 700;
            transition: 0.3s;
            cursor: pointer;
        }

        nav a:hover, nav a.active {
            color: var(--neon-cyan);
            text-shadow: 0 0 12px var(--neon-cyan);
            border-bottom: 2px solid var(--neon-cyan);
            padding-bottom: 5px;
        }

        .container {
            max-width: 1250px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* Search Section */
        .search-container {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 15px 25px;
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
        }

        .search-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px 20px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
        }

        .btn-search {
            background: linear-gradient(135deg, var(--neon-cyan), var(--ps-blue));
            border: none;
            color: #fff;
            padding: 0 25px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-search:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        /* Control Panel / Date Selector */
        .control-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn-game {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 10px 22px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-game:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }

        .date-picker-input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }

        /* Cards & Match Layout */
        .league-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .league-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 12px;
            margin-bottom: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--neon-cyan);
            font-size: 1.2rem;
            font-weight: 900;
        }

        .league-header img {
            width: 30px;
            height: 30px;
            object-fit: contain;
        }

        .match-card {
            background: rgba(8, 14, 22, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 12px;
            display: grid;
            grid-template-columns: 1fr 140px 1fr;
            align-items: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .match-card:hover {
            transform: scale(1.015);
            border-color: var(--neon-green);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        .team {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
        }

        .team.home { justify-content: flex-start; }
        .team.away { justify-content: flex-end; }

        .team img { width: 36px; height: 36px; object-fit: contain; }

        .score-box {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--neon-green);
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        /* Transfer Table & News Layout */
        .transfer-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .transfer-table th, .transfer-table td {
            padding: 12px;
            text-align: right;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .transfer-table th {
            color: var(--neon-cyan);
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .news-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 20px;
            transition: 0.3s;
        }

        .news-card:hover {
            border-color: var(--neon-green);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        }

        .news-card h3 {
            color: var(--neon-cyan);
            margin-bottom: 10px;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: 0.4s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-box {
            background: #09111a;
            border: 2px solid var(--neon-cyan);
            border-radius: 20px;
            width: 90%;
            max-width: 650px;
            padding: 30px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px; left: 20px;
            color: var(--text-sub);
            font-size: 1.8rem;
            cursor: pointer;
        }

        .close-btn:hover { color: var(--neon-pink); }
    </style>
</head>
<body>

<header>
    <div class="logo" onclick="showMatchesPage()">🎮 FT MATCHES <span class="ps-badge">PRO</span></div>
    <nav>
        <a id="nav-matches" class="active" onclick="showMatchesPage()">المباريات</a>
        <a id="nav-news" onclick="showNewsPage()">الأخبار الحصرية</a>
        <a id="nav-leagues" onclick="showLeaguesPage()">الدوريات</a>
    </nav>
</header>

<div class="container">

    <!-- Search Section -->
    <div class="search-container">
        <input type="text" id="team-search-input" class="search-input" placeholder="🔍 ابحث عن أي فريق (مثال: Real Madrid, Ahly, Barcelona)...">
        <button class="btn-search" onclick="searchTeam()">بحث شامل</button>
    </div>

    <!-- Date Controls (Visible in Matches View) -->
    <div id="controls-section" class="control-panel">
        <div style="display: flex; gap: 10px;">
            <button class="btn-game" onclick="changeDateRelative(-1)">⬅️ أمس</button>
            <button class="btn-game" onclick="selectToday()">🎮 اليوم</button>
            <button class="btn-game" onclick="changeDateRelative(1)">غداً ➡️</button>
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
            <span style="font-weight: bold; color: var(--text-sub);">التاريخ:</span>
            <input type="date" id="custom-date-picker" class="date-picker-input" onchange="selectCustomDate(this.value)">
        </div>
    </div>

    <!-- Main Content Container -->
    <div id="main-content">
        <!-- Content dynamically populated via JavaScript -->
    </div>
</div>

<!-- Match Stats Modal -->
<div class="modal-overlay" id="stats-modal">
    <div class="modal-box">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <div id="modal-body-content"></div>
    </div>
</div>

<script>
    const API_KEY = "Ed109aa442ff91b5c24d8f72cbcd23d2";
    let currentDate = new Date();

    function formatDate(date) {
        return date.toISOString().split('T')[0];
    }

    function setActiveNav(navId) {
        document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
        document.getElementById(navId).classList.add('active');
    }

    // --- PAGE SWITCHERS ---
    function showMatchesPage() {
        setActiveNav('nav-matches');
        document.getElementById('controls-section').style.display = 'flex';
        selectToday();
    }

    function showNewsPage() {
        setActiveNav('nav-news');
        document.getElementById('controls-section').style.display = 'none';
        const content = document.getElementById('main-content');
        content.innerHTML = `
            <h2 style="color: var(--neon-cyan); margin-bottom: 20px;">📰 آخر الأخبار والتغطيات الرياضية</h2>
            <div class="news-grid">
                <div class="news-card">
                    <h3>🔥 الانتقالات الصيفية</h3>
                    <p style="color: var(--text-sub);">متابعة لحظية لأحدث صفقات الأندية الأوروبية والمصرية والتحركات في الميركاتو.</p>
                </div>
                <div class="news-card">
                    <h3>🏆 دوري أبطال أوروبا</h3>
                    <p style="color: var(--text-sub);">تحليلات سريعة لمباريات الأدوار الإقصائية وتحليلات التكتيك مع إحصائيات بالأرقام.</p>
                </div>
                <div class="news-card">
                    <h3>🇪🇬 الدوري المصري الممتاز</h3>
                    <p style="color: var(--text-sub);">تغطية خاصة لمباريات الأهلي والزمالك وأهم صفقات الدوري المحلي.</p>
                </div>
            </div>
        `;
    }

    function showLeaguesPage() {
        setActiveNav('nav-leagues');
        document.getElementById('controls-section').style.display = 'none';
        const content = document.getElementById('main-content');
        content.innerHTML = `
            <h2 style="color: var(--neon-green); margin-bottom: 20px;">🏆 أهم الدوريات والبطولات</h2>
            <div class="news-grid">
                <div class="news-card" onclick="searchTeamByName('Egypt Premier League')" style="cursor:pointer;">
                    <h3>🇪🇬 الدوري المصري الممتاز</h3>
                    <p style="color: var(--text-sub);">اضغط لعرض كافة بيانات وتفاصيل البطولة.</p>
                </div>
                <div class="news-card" onclick="searchTeamByName('Premier League')" style="cursor:pointer;">
                    <h3>🏴󠁧󠁢󠁥󠁮󠁧󠁢󠁥󠁮󠁧󠁿 الدوري الإنجليزي الممتاز</h3>
                    <p style="color: var(--text-sub);">عرض الأندية والمباريات الجارية.</p>
                </div>
                <div class="news-card" onclick="searchTeamByName('La Liga')" style="cursor:pointer;">
                    <h3>🇪🇸 الدوري الإسباني</h3>
                    <p style="color: var(--text-sub);">تغطية مباريات ريال مدريد وبرشلونة.</p>
                </div>
            </div>
        `;
    }

    // --- MATCHES FETCHING ---
    async function fetchMatchesForDate(targetDateStr) {
        const container = document.getElementById('main-content');
        container.innerHTML = '<div style="text-align: center; padding: 60px; color: var(--neon-cyan); font-size: 1.2rem;">⚡ جاري تحميل المباريات...</div>';

        try {
            const response = await fetch(`https://v3.football.api-sports.io/fixtures?date=${targetDateStr}`, {
                method: "GET",
                headers: {
                    "x-rapidapi-host": "v3.football.api-sports.io",
                    "x-rapidapi-key": API_KEY
                }
            });

            const result = await response.json();

            if (!result.response || result.response.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:50px; color:var(--text-sub);">🚫 لا توجد مباريات مسجلة بتاريخ (${targetDateStr}).</div>`;
                return;
            }

            renderMatchGroups(result.response, container);
        } catch (error) {
            container.innerHTML = '<div style="text-align:center; color:var(--neon-pink); padding:40px;">حدث خطأ أثناء جلب المباريات.</div>';
        }
    }

    function renderMatchGroups(matchesData, container) {
        const grouped = {};
        matchesData.forEach(item => {
            const leagueName = item.league.name;
            if (!grouped[leagueName]) {
                grouped[leagueName] = { name: leagueName, logo: item.league.logo, matches: [] };
            }
            const matchTime = new Date(item.fixture.date).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
            grouped[leagueName].matches.push({
                id: item.fixture.id,
                homeTeam: item.teams.home.name,
                homeLogo: item.teams.home.logo,
                awayTeam: item.teams.away.name,
                awayLogo: item.teams.away.logo,
                scoreHome: item.goals.home ?? '-',
                scoreAway: item.goals.away ?? '-',
                time: matchTime
            });
        });

        container.innerHTML = '';
        Object.values(grouped).forEach(league => {
            const card = document.createElement('div');
            card.className = 'league-card';
            const matchesHTML = league.matches.map(m => `
                <div class="match-card" onclick="openMatchModal('${m.id}', '${m.homeTeam}', '${m.awayTeam}')">
                    <div class="team home"><img src="${m.homeLogo}"> <span>${m.homeTeam}</span></div>
                    <div style="text-align:center;">
                        <div class="score-box">${m.scoreHome} - ${m.scoreAway}</div>
                        <div style="font-size:0.8rem; color:var(--text-sub);">⏰ ${m.time}</div>
                    </div>
                    <div class="team away"><span>${m.awayTeam}</span> <img src="${m.awayLogo}"></div>
                </div>
            `).join('');

            card.innerHTML = `<div class="league-header"><img src="${league.logo}"> <span>🏆 ${league.name}</span></div>${matchesHTML}`;
            container.appendChild(card);
        });
    }

    // --- SEARCH TEAM & TRANSFERS ---
    async function searchTeam() {
        const query = document.getElementById('team-search-input').value.trim();
        if (!query) return;
        searchTeamByName(query);
    }

    async function searchTeamByName(query) {
        const container = document.getElementById('main-content');
        document.getElementById('controls-section').style.display = 'none';
        container.innerHTML = `<div style="text-align:center; padding:50px; color:var(--neon-cyan);">🔍 جاري البحث عن نتائج وداتا الفريق: (${query})...</div>`;

        try {
            // 1. Search Team ID
            const teamRes = await fetch(`https://v3.football.api-sports.io/teams?search=${query}`, {
                headers: { "x-rapidapi-host": "v3.football.api-sports.io", "x-rapidapi-key": API_KEY }
            });
            const teamData = await teamRes.json();

            if (!teamData.response || teamData.response.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:40px; color:var(--neon-pink);">لم يتم العثور على أي نادي بهذا الاسم. تأكد من إدخال اسم الفريق بالإنجليزية بشكل صحيح (مثال: Al Ahly أو Real Madrid).</div>`;
                return;
            }

            const teamObj = teamData.response[0].team;
            const teamId = teamObj.id;

            // 2. Fetch Team Matches
            const matchRes = await fetch(`https://v3.football.api-sports.io/fixtures?team=${teamId}&next=10`, {
                headers: { "x-rapidapi-host": "v3.football.api-sports.io", "x-rapidapi-key": API_KEY }
            });
            const matchData = await matchRes.json();

            // 3. Fetch Transfers
            const transferRes = await fetch(`https://v3.football.api-sports.io/transfers?team=${teamId}`, {
                headers: { "x-rapidapi-host": "v3.football.api-sports.io", "x-rapidapi-key": API_KEY }
            });
            const transferData = await transferRes.json();

            // Build UI
            let transfersHTML = '<tr><td colspan="3" style="text-align:center;">لا توجد انتقالات مؤكدة مؤخراً.</td></tr>';
            if (transferData.response && transferData.response.length > 0) {
                const transfersList = transferData.response[0].transfers.slice(0, 5);
                transfersHTML = transfersList.map(t => `
                    <tr>
                        <td>👤 ${t.player.name}</td>
                        <td>🗓️ ${t.date}</td>
                        <td style="color:var(--neon-green)">${t.type || 'انتقال'}</td>
                    </tr>
                `).join('');
            }

            container.innerHTML = `
                <div class="league-card" style="border-color: var(--neon-green);">
                    <div style="display:flex; align-items:center; gap:20px; margin-bottom:20px;">
                        <img src="${teamObj.logo}" style="width:70px; height:70px;">
                        <div>
                            <h1 style="color:var(--neon-green);">${teamObj.name}</h1>
                            <p style="color:var(--text-sub);">البلد: ${teamObj.country} | سنة التأسيس: ${teamObj.founded || 'غير مسجل'}</p>
                        </div>
                    </div>

                    <h3 style="color:var(--neon-cyan); margin: 20px 0 10px;">🔁 أهم الانتقالات والصفقات لـ ${teamObj.name}</h3>
                    <table class="transfer-table">
                        <thead>
                            <tr>
                                <th>اللاعب</th>
                                <th>التاريخ</th>
                                <th>نوع الصفقة</th>
                            </tr>
                        </thead>
                        <tbody>${transfersHTML}</tbody>
                    </table>

                    <h3 style="color:var(--neon-cyan); margin: 25px 0 15px;">📅 المباريات القادمة للفريق</h3>
                    <div id="team-matches-list"></div>
                </div>
            `;

            const matchesListDiv = document.getElementById('team-matches-list');
            if (matchData.response && matchData.response.length > 0) {
                renderMatchGroups(matchData.response, matchesListDiv);
            } else {
                matchesListDiv.innerHTML = '<p style="color:var(--text-sub);">لا توجد مباريات قادمة مسجلة للفريق حالياً.</p>';
            }

        } catch (err) {
            container.innerHTML = '<div style="text-align:center; color:var(--neon-pink); padding:40px;">حدث خطأ أثناء معالجة بيانات البحث.</div>';
        }
    }

    // --- MODAL STATS ---
    function openMatchModal(id, home, away) {
        const modal = document.getElementById('stats-modal');
        const body = document.getElementById('modal-body-content');
        body.innerHTML = `
            <h2 style="color:var(--neon-cyan); text-align:center; margin-bottom:15px;">📊 إحصائيات المباراة</h2>
            <p style="text-align:center; color:var(--neon-green); font-size:1.2rem; font-weight:bold;">${home} vs ${away}</p>
            <div style="margin-top:20px; text-align:center;">
                <p style="color:var(--text-sub);">جاري جلب إحصائيات اللقاء الدقيقة والتفصيلية...</p>
            </div>
        `;
        modal.classList.add('active');
    }

    function closeModal() {
        document.getElementById('stats-modal').classList.remove('active');
    }

    // --- DATE PICKER LOGIC ---
    function selectToday() {
        currentDate = new Date();
        const dateStr = formatDate(currentDate);
        document.getElementById('custom-date-picker').value = dateStr;
        fetchMatchesForDate(dateStr);
    }

    function changeDateRelative(days) {
        currentDate.setDate(currentDate.getDate() + days);
        const dateStr = formatDate(currentDate);
        document.getElementById('custom-date-picker').value = dateStr;
        fetchMatchesForDate(dateStr);
    }

    function selectCustomDate(dateVal) {
        if (!dateVal) return;
        currentDate = new Date(dateVal);
        fetchMatchesForDate(dateVal);
    }

    // Initialize Page
    selectToday();
</script>

</body>
</html>
