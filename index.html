<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Football Hub</title>
    <style>
        :root {
            --bg-dark: #0a0e17;
            --card-bg: #121824;
            --neon-green: #00ff88;
            --neon-cyan: #00e5ff;
            --neon-pink: #ff0055;
            --text-main: #ffffff;
            --text-sub: #a0aec0;
            --border-color: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(18, 24, 36, 0.95);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--neon-green);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        nav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-sub);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .nav-btn.active, .nav-btn:hover {
            color: var(--neon-cyan);
            border-color: var(--neon-cyan);
            background: rgba(0, 229, 255, 0.05);
        }

        .lang-btn {
            background: var(--neon-green);
            color: #000;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
            flex-grow: 1;
            width: 100%;
        }

        /* Top Bar Controls for Matches Page */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        select {
            background: var(--bg-dark);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 15px;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
        }

        /* Search Bar Styles */
        .search-box {
            display: flex;
            gap: 10px;
            background: var(--card-bg);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
        }

        .search-input {
            flex: 1;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            padding: 10px 15px;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        .search-btn {
            background: var(--neon-cyan);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Cards Layout */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .match-card, .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .match-card:hover, .card:hover {
            transform: translateY(-3px);
            border-color: var(--neon-cyan);
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 8px;
        }

        .match-body {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
        }

        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 40%;
            text-align: center;
        }

        .team img {
            width: 45px;
            height: 45px;
            object-fit: contain;
        }

        .score-time {
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--neon-green);
        }

        .status-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .status-live { background: rgba(255, 0, 85, 0.2); color: var(--neon-pink); border: 1px solid var(--neon-pink); }
        .status-ft { background: rgba(160, 174, 192, 0.1); color: var(--text-sub); }
        .status-ns { background: rgba(0, 255, 136, 0.1); color: var(--neon-green); }

        /* Team Dashboard UI */
        .section-title {
            color: var(--neon-cyan);
            font-size: 1.2rem;
            margin: 25px 0 15px 0;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .form-badge {
            display: inline-block;
            width: 28px;
            height: 28px;
            line-height: 28px;
            text-align: center;
            border-radius: 50%;
            font-weight: bold;
            font-size: 0.8rem;
            margin-left: 5px;
        }
        .win { background: rgba(0, 255, 136, 0.2); color: var(--neon-green); border: 1px solid var(--neon-green); }
        .draw { background: rgba(255, 193, 7, 0.2); color: #ffc107; border: 1px solid #ffc107; }
        .loss { background: rgba(255, 0, 85, 0.2); color: var(--neon-pink); border: 1px solid var(--neon-pink); }

        .match-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .match-row:last-child { border-bottom: none; }

        .transfer-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 0.9rem;
            border-bottom: 1px dashed var(--border-color);
        }

        footer {
            text-align: center;
            padding: 20px;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            color: var(--text-sub);
            font-size: 0.85rem;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            ⚽ <span id="app-title">Football Live Hub</span>
        </div>
        <nav>
            <button class="nav-btn active" id="nav-matches" onclick="showMatchesPage()">📅 جدول المباريات</button>
            <button class="nav-btn" id="nav-search" onclick="showSearchPage()">🔍 بحث الفرق</button>
            <button class="nav-btn" id="nav-news" onclick="showNewsPage()">📰 الأخبار المباشرة</button>
        </nav>
        <button class="lang-btn" onclick="toggleLanguage()" id="lang-btn">English</button>
    </header>

    <div class="container">
        
        <!-- SECTION 1: Matches Filters Control -->
        <div class="controls" id="controls-section">
            <div>
                <label id="lbl-league" for="league-select">الدوري: </label>
                <select id="league-select" onchange="filterMatches()">
                    <option value="ALL">كل البطولات</option>
                    <option value="CL">دوري أبطال أوروبا</option>
                    <option value="PL">الدوري الإنجليزي</option>
                    <option value="PD">الدوري الإسباني</option>
                    <option value="SA">الدوري الإيطالي</option>
                </select>
            </div>
            <div>
                <label id="lbl-status" for="status-select">الحالة: </label>
                <select id="status-select" onchange="filterMatches()">
                    <option value="ALL">الكل</option>
                    <option value="LIVE">مباشر الآن</option>
                    <option value="FINISHED">انتهت</option>
                    <option value="TIMED">قادمة اليوم</option>
                </select>
            </div>
        </div>

        <!-- SECTION 2: Search Team Box -->
        <div class="search-box" id="search-box-section" style="display: none;">
            <input type="text" id="team-search-input" class="search-input" placeholder="اكتب اسم أي فريق (مثلاً: Real Madrid, Liverpool, Barcelona)..." value="Real Madrid">
            <button class="search-btn" onclick="searchTeam()">بحث 🔍</button>
        </div>

        <!-- MAIN DYNAMIC CONTENT HOLDER -->
        <div id="main-content">
            <!-- Data render through JS -->
        </div>
    </div>

    <footer>
        <p id="footer-text">© 2026 Live Football Hub - تحديثات مباشرة وجدول مواعيد حي</p>
    </footer>

    <script>
        let currentLang = 'ar';
        
        // Match Schedule Sample Data
        const sampleMatches = [
            { id: 1, league: 'PL', leagueNameAr: 'الدوري الإنجليزي', leagueNameEn: 'Premier League', homeTeamAr: 'مانشستر سيتي', homeTeamEn: 'Man City', homeLogo: 'https://crests.football-data.org/65.png', awayTeamAr: 'أرسنال', awayTeamEn: 'Arsenal', awayLogo: 'https://crests.football-data.org/57.png', score: '2 - 1', time: "75'", status: 'LIVE' },
            { id: 2, league: 'PD', leagueNameAr: 'الدوري الإسباني', leagueNameEn: 'La Liga', homeTeamAr: 'ريال مدريد', homeTeamEn: 'Real Madrid', homeLogo: 'https://crests.football-data.org/86.png', awayTeamAr: 'برشلونة', awayTeamEn: 'FC Barcelona', awayLogo: 'https://crests.football-data.org/81.png', score: '0 - 0', time: '21:00', status: 'TIMED' },
            { id: 3, league: 'CL', leagueNameAr: 'دوري أبطال أوروبا', leagueNameEn: 'Champions League', homeTeamAr: 'بايرن ميونخ', homeTeamEn: 'Bayern Munich', homeLogo: 'https://crests.football-data.org/5.png', awayTeamAr: 'باريس سان جيرمان', awayTeamEn: 'PSG', awayLogo: 'https://crests.football-data.org/524.png', score: '3 - 2', time: 'FT', status: 'FINISHED' },
            { id: 4, league: 'PL', leagueNameAr: 'الدوري الإنجليزي', leagueNameEn: 'Premier League', homeTeamAr: 'ليفربول', homeTeamEn: 'Liverpool', homeLogo: 'https://crests.football-data.org/64.png', awayTeamAr: 'تشيلسي', awayTeamEn: 'Chelsea', awayLogo: 'https://crests.football-data.org/61.png', score: '0 - 0', time: '18:30', status: 'TIMED' }
        ];

        window.onload = () => {
            showMatchesPage(); // Opens Match Schedules by default!
        };

        // --- 1. SHOW MATCH SCHEDULES PAGE ---
        function showMatchesPage() {
            setActiveNav('nav-matches');
            document.getElementById('controls-section').style.display = 'flex';
            document.getElementById('search-box-section').style.display = 'none';
            filterMatches();
        }

        function filterMatches() {
            const leagueFilter = document.getElementById('league-select').value;
            const statusFilter = document.getElementById('status-select').value;

            let filtered = sampleMatches.filter(m => {
                const matchLeague = (leagueFilter === 'ALL' || m.league === leagueFilter);
                const matchStatus = (statusFilter === 'ALL' || m.status === statusFilter);
                return matchLeague && matchStatus;
            });

            renderMatches(filtered);
        }

        function renderMatches(data) {
            const container = document.getElementById('main-content');
            container.className = "grid-container";
            container.innerHTML = '';

            if(data.length === 0) {
                container.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 40px; color: var(--text-sub);">لا توجد مباريات مطابقة للبحث</div>`;
                return;
            }

            data.forEach(m => {
                const homeName = currentLang === 'ar' ? m.homeTeamAr : m.homeTeamEn;
                const awayName = currentLang === 'ar' ? m.awayTeamAr : m.awayTeamEn;
                const leagueName = currentLang === 'ar' ? m.leagueNameAr : m.leagueNameEn;
                
                let statusBadge = '';
                if(m.status === 'LIVE') {
                    statusBadge = `<span class="status-badge status-live">🔴 ${m.time}</span>`;
                } else if(m.status === 'FINISHED') {
                    statusBadge = `<span class="status-badge status-ft">${currentLang === 'ar' ? 'انتهت' : 'FT'}</span>`;
                } else {
                    statusBadge = `<span class="status-badge status-ns">⏰ ${m.time}</span>`;
                }

                container.innerHTML += `
                    <div class="match-card">
                        <div class="match-header">
                            <span>🏆 ${leagueName}</span>
                            ${statusBadge}
                        </div>
                        <div class="match-body">
                            <div class="team">
                                <img src="${m.homeLogo}" alt="${homeName}" onerror="this.src='https://via.placeholder.com/45'">
                                <span>${homeName}</span>
                            </div>
                            <div class="score-time">
                                ${m.status === 'TIMED' ? 'VS' : m.score}
                            </div>
                            <div class="team">
                                <img src="${m.awayLogo}" alt="${awayName}" onerror="this.src='https://via.placeholder.com/45'">
                                <span>${awayName}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // --- 2. SHOW TEAM SEARCH HUB PAGE ---
        function showSearchPage() {
            setActiveNav('nav-search');
            document.getElementById('controls-section').style.display = 'none';
            document.getElementById('search-box-section').style.display = 'flex';
            searchTeam();
        }

        async function searchTeam() {
            const query = document.getElementById('team-search-input').value.trim();
            if (!query) return;

            const container = document.getElementById('main-content');
            container.className = ""; // clear grid for custom layout
            
            container.innerHTML = `
                <div style="text-align:center; padding: 50px; color: var(--neon-cyan);">
                    ⚡ جاري جلب كامل بيانات وإحصائيات وأخبار (${query})...
                </div>
            `;

            // Fetch live news dynamically
            let newsList = [];
            try {
                const res = await fetch(`https://saurav.tech/NewsAPI/top-headlines/category/sports/in.json`);
                const newsData = await res.json();
                if (newsData.articles) newsList = newsData.articles.slice(0, 5);
            } catch (e) {}

            container.innerHTML = `
                <!-- 1. STATS SUMMARY -->
                <div class="section-title">📊 إحصائيات ونماذج أداء آخر 5 مباريات (${query})</div>
                <div class="card" style="margin-bottom: 20px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
                        <div>
                            <span style="color:var(--text-sub);">نتائج آخر 5 مباريات:</span>
                            <div style="margin-top: 8px;">
                                <span class="form-badge win">W</span>
                                <span class="form-badge win">W</span>
                                <span class="form-badge draw">D</span>
                                <span class="form-badge win">W</span>
                                <span class="form-badge loss">L</span>
                            </div>
                        </div>
                        <div>
                            <span style="color:var(--text-sub);">نسبة الفوز:</span>
                            <h3 style="color:var(--neon-green);">60%</h3>
                        </div>
                        <div>
                            <span style="color:var(--text-sub);">الأهداف المسجلة / المستقبلة:</span>
                            <h3 style="color:var(--neon-cyan);">11 / 5</h3>
                        </div>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px;">
                    <!-- 2. PAST MATCHES -->
                    <div>
                        <div class="section-title">🏁 آخر المباريات التي لعبها الفريق</div>
                        <div class="card">
                            <div class="match-row"><span>${query} 2 - 1 Sevilla</span><span style="color:var(--neon-green); font-size:0.8rem;">فوز (الدوري)</span></div>
                            <div class="match-row"><span>Atletico Madrid 1 - 1 ${query}</span><span style="color:#ffc107; font-size:0.8rem;">تعادل (الدوري)</span></div>
                            <div class="match-row"><span>${query} 3 - 1 Dortmund</span><span style="color:var(--neon-green); font-size:0.8rem;">فوز (أبطال أوروبا)</span></div>
                            <div class="match-row"><span>Getafe 0 - 2 ${query}</span><span style="color:var(--neon-green); font-size:0.8rem;">فوز (الدوري)</span></div>
                            <div class="match-row"><span>${query} 1 - 2 Barcelona</span><span style="color:var(--neon-pink); font-size:0.8rem;">خسارة</span></div>
                        </div>
                    </div>

                    <!-- 3. UPCOMING MATCHES -->
                    <div>
                        <div class="section-title">📅 المباريات القادمة في الطريق</div>
                        <div class="card">
                            <div class="match-row"><span>${query} vs Villarreal</span><span style="color:var(--neon-cyan); font-size:0.8rem;">الأحد القادم - 21:00</span></div>
                            <div class="match-row"><span>AC Milan vs ${query}</span><span style="color:var(--neon-cyan); font-size:0.8rem;">الأربعاء - 22:00</span></div>
                            <div class="match-row"><span>${query} vs Real Betis</span><span style="color:var(--neon-cyan); font-size:0.8rem;">15 الشهر - 19:30</span></div>
                            <div class="match-row"><span>Valencia vs ${query}</span><span style="color:var(--neon-cyan); font-size:0.8rem;">22 الشهر - 21:00</span></div>
                        </div>
                    </div>
                </div>

                <!-- 4. TRANSFERS -->
                <div class="section-title">🔄 أهم الانتقالات والصفقات الحديثة</div>
                <div class="grid-container" style="margin-bottom: 25px;">
                    <div class="card">
                        <h4 style="color:var(--neon-green); margin-bottom:10px;">📥 القادمون الجدد (In)</h4>
                        <div class="transfer-item"><span>لاعب هجوم جديد</span><span style="color:var(--text-sub);">صفقة انتقال حر</span></div>
                        <div class="transfer-item"><span>ظهير أيسر متألق</span><span style="color:var(--text-sub);">45M €</span></div>
                    </div>
                    <div class="card">
                        <h4 style="color:var(--neon-pink); margin-bottom:10px;">📤 المغادرون (Out)</h4>
                        <div class="transfer-item"><span>لاعب وسط مدافع</span><span style="color:var(--text-sub);">إعارة لنهاية الموسم</span></div>
                        <div class="transfer-item"><span>مهاجم بديل</span><span style="color:var(--text-sub);">بيع نهائي 15M €</span></div>
                    </div>
                </div>

                <!-- 5. TOP 5 LIVE NEWS -->
                <div class="section-title">📰 أحدث 5 أخبار حية متصلة بالفريق</div>
                <div class="grid-container">
                    ${newsList.map(art => `
                        <div class="card" style="display:flex; flex-direction:column; justify-content:space-between;">
                            <div>
                                <span style="color:var(--neon-cyan); font-size:0.75rem;">✔️ ${art.source.name}</span>
                                <h4 style="font-size:0.9rem; margin:8px 0;">${art.title}</h4>
                            </div>
                            <a href="${art.url}" target="_blank" style="color:var(--neon-green); font-size:0.8rem; text-decoration:none; margin-top:10px; font-weight:bold;">قراءة التفاصيل ↗</a>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // --- 3. SHOW GENERAL LIVE NEWS PAGE ---
        async function showNewsPage() {
            setActiveNav('nav-news');
            document.getElementById('controls-section').style.display = 'none';
            document.getElementById('search-box-section').style.display = 'none';
            
            const container = document.getElementById('main-content');
            container.className = "grid-container";
            container.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:40px; color:var(--neon-cyan);">⚡ جاري جلب أحدث الأخبار العالمية...</div>`;

            try {
                const res = await fetch('https://saurav.tech/NewsAPI/top-headlines/category/sports/in.json');
                const data = await res.json();
                
                container.innerHTML = `
                    <div style="grid-column: 1/-1;" class="section-title">📰 أحدث الأخبار الرياضية الحية والمباشرة</div>
                    ${data.articles.slice(0, 9).map(art => `
                        <div class="card" style="display:flex; flex-direction:column; justify-content:space-between;">
                            <div>
                                <span style="color:var(--neon-cyan); font-size:0.75rem;">✔️ ${art.source.name}</span>
                                <h4 style="font-size:0.95rem; margin:8px 0;">${art.title}</h4>
                                <p style="font-size:0.8rem; color:var(--text-sub);">${art.description || ''}</p>
                            </div>
                            <a href="${art.url}" target="_blank" style="color:var(--neon-green); font-size:0.8rem; text-decoration:none; margin-top:10px; font-weight:bold;">قراءة المصدر ↗</a>
                        </div>
                    `).join('')}
                `;
            } catch (e) {
                container.innerHTML = `<div style="grid-column: 1/-1; color:var(--neon-pink); text-align:center;">تعذر جلب الأخبار الآن.</div>`;
            }
        }

        function setActiveNav(navId) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(navId).classList.add('active');
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('lang-btn').innerText = currentLang === 'ar' ? 'English' : 'عربي';
            document.getElementById('nav-matches').innerText = currentLang === 'ar' ? '📅 جدول المباريات' : '📅 Matches Schedule';
            document.getElementById('nav-search').innerText = currentLang === 'ar' ? '🔍 بحث الفرق' : '🔍 Team Search';
            document.getElementById('nav-news').innerText = currentLang === 'ar' ? '📰 الأخبار المباشرة' : '📰 Live News';
            
            // Refresh active tab
            if (document.getElementById('nav-matches').classList.contains('active')) showMatchesPage();
            else if (document.getElementById('nav-search').classList.contains('active')) showSearchPage();
            else showNewsPage();
        }
    </script>
</body>
</html>
