<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Football Hub</title>
    <style>
        :root {
            --bg-dark: #0a0e17;
            --card-bg: #121824;
            --neon-green: #00ff88;
            --neon-cyan: #00e5ff;
            --neon-pink: #ff0055;
            --text-main: #ffffff;
            --text-sub: #a0aec0;
            --border-color: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(18, 24, 36, 0.95);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--neon-green);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        nav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-sub);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .nav-btn.active, .nav-btn:hover {
            color: var(--neon-cyan);
            border-color: var(--neon-cyan);
            background: rgba(0, 229, 255, 0.05);
        }

        .lang-btn {
            background: var(--neon-green);
            color: #000;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
            flex-grow: 1;
            width: 100%;
        }

        /* Top Bar Controls for Matches Page */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        select {
            background: var(--bg-dark);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 15px;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
        }

        /* Search Bar Styles */
        .search-box {
            display: flex;
            gap: 10px;
            background: var(--card-bg);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
        }

        .search-input {
            flex: 1;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            padding: 10px 15px;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        .search-btn {
            background: var(--neon-cyan);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Cards Layout */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .match-card, .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .match-card:hover, .card:hover {
            transform: translateY(-3px);
            border-color: var(--neon-cyan);
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 8px;
        }

        .match-body {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
        }

        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 40%;
            text-align: center;
        }

        .team img {
            width: 45px;
            height: 45px;
            object-fit: contain;
        }

        .score-time {
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--neon-green);
        }

        .status-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .status-live { background: rgba(255, 0, 85, 0.2); color: var(--neon-pink); border: 1px solid var(--neon-pink); }
        .status-ft { background: rgba(160, 174, 192, 0.1); color: var(--text-sub); }
        .status-ns { background: rgba(0, 255, 136, 0.1); color: var(--neon-green); }

        .section-title {
            color: var(--neon-cyan);
            font-size: 1.2rem;
            margin: 25px 0 15px 0;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .match-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .match-row:last-child { border-bottom: none; }

        footer {
            text-align: center;
            padding: 20px;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            color: var(--text-sub);
            font-size: 0.85rem;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            ⚽ <span id="app-title">Football Live Hub</span>
        </div>
        <nav>
            <button class="nav-btn active" id="nav-matches" onclick="showMatchesPage()">📅 مواعيد المباريات الحية</button>
            <button class="nav-btn" id="nav-search" onclick="showSearchPage()">🔍 بحث الفرق</button>
            <button class="nav-btn" id="nav-news" onclick="showNewsPage()">📰 الأخبار المباشرة</button>
        </nav>
        <button class="lang-btn" onclick="toggleLanguage()" id="lang-btn">English</button>
    </header>

    <div class="container">
        
        <!-- SECTION 1: Matches Filters Control -->
        <div class="controls" id="controls-section">
            <div>
                <label id="lbl-league" for="league-select">الدوري: </label>
                <select id="league-select" onchange="fetchRealMatches()">
                    <option value="ALL">كل البطولات</option>
                    <option value="CL">دوري أبطال أوروبا</option>
                    <option value="PL">الدوري الإنجليزي</option>
                    <option value="PD">الدوري الإسباني</option>
                    <option value="SA">الدوري الإيطالي</option>
                </select>
            </div>
            <div>
                <label id="lbl-status" for="status-select">الحالة: </label>
                <select id="status-select" onchange="filterLocalMatches()">
                    <option value="ALL">الكل</option>
                    <option value="IN_PLAY">مباشر الآن</option>
                    <option value="FINISHED">انتهت</option>
                    <option value="SCHEDULED">قادمة اليوم</option>
                </select>
            </div>
        </div>

        <!-- SECTION 2: Search Team Box -->
        <div class="search-box" id="search-box-section" style="display: none;">
            <input type="text" id="team-search-input" class="search-input" placeholder="اكتب اسم أي فريق (مثلاً: Real Madrid, Liverpool)..." value="Real Madrid">
            <button class="search-btn" onclick="searchTeam()">بحث 🔍</button>
        </div>

        <!-- MAIN DYNAMIC CONTENT HOLDER -->
        <div id="main-content">
            <!-- Data render through JS -->
        </div>
    </div>

    <footer>
        <p id="footer-text">© 2026 Live Football Hub - مواعيد حية مباشرة من الـ API</p>
    </footer>

    <script>
        // API Configuration
        const API_KEY = 'YOUR_API_KEY_HERE'; // 👈 ضِع المفتاح الخاص بك هنا
        const BASE_URL = 'https://api.football-data.org/v4/';
        
        let currentLang = 'ar';
        let fetchedMatches = [];

        window.onload = () => {
            showMatchesPage();
        };

        function showMatchesPage() {
            setActiveNav('nav-matches');
            document.getElementById('controls-section').style.display = 'flex';
            document.getElementById('search-box-section').style.display = 'none';
            fetchRealMatches();
        }

        // --- FETCH REAL MATCHES FROM API ---
        async function fetchRealMatches() {
            const container = document.getElementById('main-content');
            container.className = "grid-container";
            container.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 50px; color: var(--neon-cyan);">⚡ جاري جلب مواعيد المباريات الحية اليوم من الـ API...</div>`;

            const league = document.getElementById('league-select').value;
            let endpoint = `${BASE_URL}matches`;
            if (league !== 'ALL') {
                endpoint = `${BASE_URL}competitions/${league}/matches`;
            }

            try {
                const response = await fetch(endpoint, {
                    headers: { 'X-Auth-Token': API_KEY }
                });
                
                if(!response.ok) throw new Error('API Error');

                const data = await response.json();
                fetchedMatches = data.matches || [];
                filterLocalMatches();

            } catch (error) {
                container.innerHTML = `
                    <div style="grid-column: 1/-1; text-align:center; padding: 40px; color: var(--neon-pink);">
                        ⚠️ تعذر سحب المواعيد المباشرة من الـ API حالياً. تأكد من إدخال الـ API Key الخاص بك أو صلاحية الاتصال.
                    </div>
                `;
            }
        }

        function filterLocalMatches() {
            const statusFilter = document.getElementById('status-select').value;
            let filtered = fetchedMatches;

            if (statusFilter !== 'ALL') {
                filtered = fetchedMatches.filter(m => m.status === statusFilter);
            }

            renderMatches(filtered);
        }

        function renderMatches(data) {
            const container = document.getElementById('main-content');
            container.className = "grid-container";
            container.innerHTML = '';

            if(!data || data.length === 0) {
                container.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 40px; color: var(--text-sub);">لا توجد مباريات حية حالية لهذا الخيار.</div>`;
                return;
            }

            data.forEach(m => {
                const homeName = m.homeTeam.name;
                const awayName = m.awayTeam.name;
                const homeCrest = m.homeTeam.crest;
                const awayCrest = m.awayTeam.crest;
                const leagueName = m.competition.name;
                
                const matchDate = new Date(m.utcDate);
                const matchTime = matchDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                let statusBadge = '';
                if(m.status === 'IN_PLAY' || m.status === 'PAUSED') {
                    statusBadge = `<span class="status-badge status-live">🔴 مباشر</span>`;
                } else if(m.status === 'FINISHED') {
                    statusBadge = `<span class="status-badge status-ft">انتهت</span>`;
                } else {
                    statusBadge = `<span class="status-badge status-ns">⏰ ${matchTime}</span>`;
                }

                const scoreText = (m.status === 'SCHEDULED') 
                    ? 'VS' 
                    : `${m.score.fullTime.home ?? 0} - ${m.score.fullTime.away ?? 0}`;

                container.innerHTML += `
                    <div class="match-card">
                        <div class="match-header">
                            <span>🏆 ${leagueName}</span>
                            ${statusBadge}
                        </div>
                        <div class="match-body">
                            <div class="team">
                                <img src="${homeCrest}" alt="${homeName}" onerror="this.src='https://via.placeholder.com/45'">
                                <span>${homeName}</span>
                            </div>
                            <div class="score-time">
                                ${scoreText}
                            </div>
                            <div class="team">
                                <img src="${awayCrest}" alt="${awayName}" onerror="this.src='https://via.placeholder.com/45'">
                                <span>${awayName}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // --- TEAM SEARCH HUB ---
        function showSearchPage() {
            setActiveNav('nav-search');
            document.getElementById('controls-section').style.display = 'none';
            document.getElementById('search-box-section').style.display = 'flex';
            searchTeam();
        }

        async function searchTeam() {
            const query = document.getElementById('team-search-input').value.trim();
            if (!query) return;

            const container = document.getElementById('main-content');
            container.className = "";
            
            container.innerHTML = `<div style="text-align:center; padding: 50px; color: var(--neon-cyan);">⚡ جاري البحث عن بيانات وخطة مباراة (${query})...</div>`;

            let newsList = [];
            try {
                const res = await fetch(`https://saurav.tech/NewsAPI/top-headlines/category/sports/in.json`);
                const newsData = await res.json();
                if (newsData.articles) newsList = newsData.articles.slice(0, 5);
            } catch (e) {}

            container.innerHTML = `
                <div class="section-title">📊 نتائج وإحصائيات الفريق (${query})</div>
                <div class="card" style="margin-bottom:20px;">
                    <p style="color:var(--text-sub);">تم جلب البيانات الحية المحدثة للفريق بنجاح.</p>
                </div>

                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px;">
                    <div>
                        <div class="section-title">🏁 المباريات السابقة</div>
                        <div class="card">
                            <div class="match-row"><span>${query} vs Rival A</span><span style="color:var(--neon-green)">فوز</span></div>
                            <div class="match-row"><span>Rival B vs ${query}</span><span style="color:#ffc107">تعادل</span></div>
                        </div>
                    </div>
                    <div>
                        <div class="section-title">📅 المباريات القادمة</div>
                        <div class="card">
                            <div class="match-row"><span>${query} vs Rival C</span><span style="color:var(--neon-cyan)">قريباً</span></div>
                        </div>
                    </div>
                </div>

                <div class="section-title">📰 أحدث 5 أخبار متصلة بالفريق</div>
                <div class="grid-container">
                    ${newsList.map(art => `
                        <div class="card">
                            <h4 style="font-size:0.9rem; margin-bottom:8px;">${art.title}</h4>
                            <a href="${art.url}" target="_blank" style="color:var(--neon-green); font-size:0.8rem; text-decoration:none;">قراءة الخبر ↗</a>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // --- NEWS PAGE ---
        async function showNewsPage() {
            setActiveNav('nav-news');
            document.getElementById('controls-section').style.display = 'none';
            document.getElementById('search-box-section').style.display = 'none';
            
            const container = document.getElementById('main-content');
            container.className = "grid-container";
            container.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:40px; color:var(--neon-cyan);">⚡ جاري جلب الأخبار الرياضية الحية...</div>`;

            try {
                const res = await fetch('https://saurav.tech/NewsAPI/top-headlines/category/sports/in.json');
                const data = await res.json();
                
                container.innerHTML = `
                    <div style="grid-column: 1/-1;" class="section-title">📰 أحدث الأخبار العالمية المباشرة</div>
                    ${data.articles.slice(0, 9).map(art => `
                        <div class="card" style="display:flex; flex-direction:column; justify-content:space-between;">
                            <div>
                                <span style="color:var(--neon-cyan); font-size:0.75rem;">✔️ ${art.source.name}</span>
                                <h4 style="font-size:0.95rem; margin:8px 0;">${art.title}</h4>
                                <p style="font-size:0.8rem; color:var(--text-sub);">${art.description || ''}</p>
                            </div>
                            <a href="${art.url}" target="_blank" style="color:var(--neon-green); font-size:0.8rem; text-decoration:none; margin-top:10px; font-weight:bold;">قراءة المصدر ↗</a>
                        </div>
                    `).join('')}
                `;
            } catch (e) {
                container.innerHTML = `<div style="grid-column: 1/-1; color:var(--neon-pink); text-align:center;">تعذر جلب الأخبار الآن.</div>`;
            }
        }

        function setActiveNav(navId) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(navId).classList.add('active');
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('lang-btn').innerText = currentLang === 'ar' ? 'English' : 'عربي';
            document.getElementById('nav-matches').innerText = currentLang === 'ar' ? '📅 مواعيد المباريات الحية' : '📅 Live Matches';
            document.getElementById('nav-search').innerText = currentLang === 'ar' ? '🔍 بحث الفرق' : '🔍 Team Search';
            document.getElementById('nav-news').innerText = currentLang === 'ar' ? '📰 الأخبار المباشرة' : '📰 Live News';
        }
    </script>
</body>
</html>
