<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FT MATCHES - ULTIMATE PRO EDITION</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #04070a;
            --card-bg: rgba(15, 23, 42, 0.88);
            --neon-green: #00ff88;
            --neon-cyan: #00e5ff;
            --neon-pink: #ff0055;
            --ps-blue: #0070d1;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-glow: rgba(0, 229, 255, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 112, 209, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(0, 255, 136, 0.1) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(4, 7, 10, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 229, 255, 0.5);
            cursor: pointer;
        }

        .ps-badge {
            font-family: 'Orbitron', sans-serif;
            background: var(--ps-blue);
            color: #fff;
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 4px;
            box-shadow: 0 0 10px var(--ps-blue);
        }

        nav a {
            color: var(--text-sub);
            text-decoration: none;
            margin: 0 15px;
            font-size: 1.05rem;
            font-weight: 700;
            transition: 0.3s;
            cursor: pointer;
        }

        nav a:hover, nav a.active {
            color: var(--neon-cyan);
            text-shadow: 0 0 12px var(--neon-cyan);
            border-bottom: 2px solid var(--neon-cyan);
            padding-bottom: 5px;
        }

        .container {
            max-width: 1250px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* Search Bar Wrapper */
        .search-wrapper {
            position: relative;
            margin-bottom: 25px;
        }

        .search-container {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 12px 20px;
            display: flex;
            gap: 10px;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
        }

        .search-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px 20px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
        }

        .suggestions-dropdown {
            position: absolute;
            top: 105%;
            right: 0;
            left: 0;
            background: #09121c;
            border: 1px solid var(--neon-cyan);
            border-radius: 12px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 200;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .suggestion-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: 0.2s;
        }

        .suggestion-item:hover {
            background: rgba(0, 229, 255, 0.15);
            color: var(--neon-green);
        }

        .suggestion-item img {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        /* Controls */
        .control-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn-game {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 10px 22px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-game:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }

        .date-picker-input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }

        /* League Card */
        .league-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .league-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 12px;
            margin-bottom: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--neon-cyan);
            font-size: 1.2rem;
            font-weight: 900;
        }

        .league-header img { width: 30px; height: 30px; object-fit: contain; }

        /* Match Card */
        .match-card {
            background: rgba(8, 14, 22, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: 0.3s;
            cursor: pointer;
        }

        .match-card:hover {
            transform: scale(1.01);
            border-color: var(--neon-green);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        .match-main-info {
            display: grid;
            grid-template-columns: 1fr 140px 1fr;
            align-items: center;
        }

        .team {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
        }

        .team.home { justify-content: flex-start; }
        .team.away { justify-content: flex-end; }
        .team img { width: 36px; height: 36px; object-fit: contain; }

        .score-box {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--neon-green);
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
            text-align: center;
        }

        /* Broadcast Badge */
        .match-broadcast {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            background: rgba(0, 229, 255, 0.08);
            border-top: 1px dashed rgba(0, 229, 255, 0.2);
            padding-top: 8px;
            font-size: 0.85rem;
            color: var(--neon-cyan);
            font-weight: bold;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: 0.4s ease;
        }

        .modal-overlay.active { opacity: 1; pointer-events: all; }

        .modal-box {
            background: #09111a;
            border: 2px solid var(--neon-cyan);
            border-radius: 20px;
            width: 90%;
            max-width: 650px;
            padding: 30px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px; left: 20px;
            color: var(--text-sub);
            font-size: 1.8rem;
            cursor: pointer;
        }

        .close-btn:hover { color: var(--neon-pink); }
    </style>
</head>
<body>

<header>
    <div class="logo" onclick="showMatchesPage()">🎮 FT MATCHES <span class="ps-badge">PRO</span></div>
    <nav>
        <a id="nav-matches" class="active" onclick="showMatchesPage()">المباريات</a>
        <a id="nav-news" onclick="showNewsPage()">الأخبار الحصرية</a>
        <a id="nav-leagues" onclick="showLeaguesPage()">الدوريات</a>
    </nav>
</header>

<div class="container">

    <!-- Search Section -->
    <div class="search-wrapper">
        <div class="search-container">
            <input type="text" id="team-search-input" class="search-input" placeholder="🔍 اكتب حرفين من اسم الفريق (مثال: Ah, Re, Bar, Ma)..." oninput="handleSearchInput(this.value)">
        </div>
        <div id="suggestions-box" class="suggestions-dropdown"></div>
    </div>

    <!-- Date Controls -->
    <div id="controls-section" class="control-panel">
        <div style="display: flex; gap: 10px;">
            <button class="btn-game" onclick="changeDateRelative(-1)">⬅️ أمس</button>
            <button class="btn-game" onclick="selectToday()">🎮 اليوم</button>
            <button class="btn-game" onclick="changeDateRelative(1)">غداً ➡️</button>
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
            <span style="font-weight: bold; color: var(--text-sub);">التاريخ:</span>
            <input type="date" id="custom-date-picker" class="date-picker-input" onchange="selectCustomDate(this.value)">
        </div>
    </div>

    <!-- Main Content -->
    <div id="main-content"></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="stats-modal">
    <div class="modal-box">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <div id="modal-body-content"></div>
    </div>
</div>

<script>
    const API_KEY = "Ed109aa442ff91b5c24d8f72cbcd23d2";
    let currentDate = new Date();
    let debounceTimer;

    function formatDate(date) { return date.toISOString().split('T')[0]; }

    function setActiveNav(navId) {
        document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
        document.getElementById(navId).classList.add('active');
    }

    function showMatchesPage() {
        setActiveNav('nav-matches');
        document.getElementById('controls-section').style.display = 'flex';
        selectToday();
    }

    // --- AUTO-COMPLETE SEARCH ---
    function handleSearchInput(val) {
        clearTimeout(debounceTimer);
        const dropdown = document.getElementById('suggestions-box');
        
        if (val.trim().length < 2) {
            dropdown.style.display = 'none';
            return;
        }

        debounceTimer = setTimeout(async () => {
            try {
                const res = await fetch(`https://v3.football.api-sports.io/teams?search=${val}`, {
                    headers: { "x-rapidapi-host": "v3.football.api-sports.io", "x-rapidapi-key": API_KEY }
                });
                const data = await res.json();

                if (data.response && data.response.length > 0) {
                    dropdown.innerHTML = '';
                    data.response.slice(0, 7).forEach(item => {
                        const team = item.team;
                        dropdown.innerHTML += `
                            <div class="suggestion-item" onclick="selectSuggestedTeam('${team.id}', '${team.name}')">
                                <img src="${team.logo}" alt="">
                                <div>
                                    <strong style="color:#fff;">${team.name}</strong> 
                                    <span style="font-size:0.8rem; color:var(--text-sub);">(${team.country})</span>
                                </div>
                            </div>
                        `;
                    });
                    dropdown.style.display = 'block';
                } else {
                    dropdown.style.display = 'none';
                }
            } catch (e) { console.error(e); }
        }, 300);
    }

    async function selectSuggestedTeam(teamId, teamName) {
        document.getElementById('suggestions-box').style.display = 'none';
        document.getElementById('team-search-input').value = teamName;
        loadTeamFullData(teamId, teamName);
    }

    async function loadTeamFullData(teamId, teamName) {
        const container = document.getElementById('main-content');
        document.getElementById('controls-section').style.display = 'none';
        container.innerHTML = `<div style="text-align:center; padding:50px; color:var(--neon-cyan);">⚡ جاري جلب داتا ومباريات (${teamName})...</div>`;

        try {
            const matchRes = await fetch(`https://v3.football.api-sports.io/fixtures?team=${teamId}&next=10`, {
                headers: { "x-rapidapi-host": "v3.football.api-sports.io", "x-rapidapi-key": API_KEY }
            });
            const matchData = await matchRes.json();

            container.innerHTML = `<h2 style="color:var(--neon-green); margin-bottom:20px;">🎮 مباريات وتفاصيل: ${teamName}</h2><div id="team-matches"></div>`;
            renderMatchGroups(matchData.response || [], document.getElementById('team-matches'));
        } catch (e) {
            container.innerHTML = '<div style="text-align:center; color:var(--neon-pink); padding:40px;">حدث خطأ أثناء جلب داتا الفريق.</div>';
        }
    }

    // --- FETCH MATCHES & ACCURATE BROADCASTERS ---
    async function fetchMatchesForDate(targetDateStr) {
        const container = document.getElementById('main-content');
        container.innerHTML = '<div style="text-align: center; padding: 60px; color: var(--neon-cyan); font-size: 1.2rem;">⚡ جاري تحميل المباريات القادمة والقنوات الناقلة...</div>';

        try {
            const response = await fetch(`https://v3.football.api-sports.io/fixtures?date=${targetDateStr}`, {
                method: "GET",
                headers: {
                    "x-rapidapi-host": "v3.football.api-sports.io",
                    "x-rapidapi-key": API_KEY
                }
            });

            const result = await response.json();

            if (!result.response || result.response.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:50px; color:var(--text-sub);">🚫 لا توجد مباريات مسجلة بتاريخ (${targetDateStr}).</div>`;
                return;
            }

            renderMatchGroups(result.response, container);
        } catch (error) {
            container.innerHTML = '<div style="text-align:center; color:var(--neon-pink); padding:40px;">حدث خطأ أثناء الاتصال بالسيرفر.</div>';
        }
    }

    // Extraction function for Real Broadcaster channels from API Data
    function extractBroadcaster(item) {
        // If the API provides broadcasters array/data directly for the fixture
        if (item.fixture && item.fixture.broadcasters && item.fixture.broadcasters.length > 0) {
            return `📺 ${item.fixture.broadcasters.map(b => b.name).join(', ')}`;
        } 
        
        // If specific regional channel info exists in status or venue info
        if (item.league && item.league.standings) {
            return `📺 ${item.league.name} TV Direct`;
        }

        // Return strictly factual statement when broadcaster is unlisted in current free feed
        return "📺 القناة: غير محددة رسمياً في السيرفر";
    }

    function renderMatchGroups(matchesData, container) {
        const grouped = {};
        matchesData.forEach(item => {
            const leagueName = item.league.name;
            if (!grouped[leagueName]) {
                grouped[leagueName] = { name: leagueName, logo: item.league.logo, matches: [] };
            }
            const matchTime = new Date(item.fixture.date).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
            
            // Extract channel data directly without estimation
            const channelInfo = extractBroadcaster(item);

            grouped[leagueName].matches.push({
                id: item.fixture.id,
                homeTeam: item.teams.home.name,
                homeLogo: item.teams.home.logo,
                awayTeam: item.teams.away.name,
                awayLogo: item.teams.away.logo,
                scoreHome: item.goals.home ?? '-',
                scoreAway: item.goals.away ?? '-',
                time: matchTime,
                channel: channelInfo
            });
        });

        container.innerHTML = '';
        Object.values(grouped).forEach(league => {
            const card = document.createElement('div');
            card.className = 'league-card';
            const matchesHTML = league.matches.map(m => `
                <div class="match-card" onclick="openMatchModal('${m.id}', '${m.homeTeam}', '${m.awayTeam}')">
                    <div class="match-main-info">
                        <div class="team home"><img src="${m.homeLogo}"> <span>${m.homeTeam}</span></div>
                        <div>
                            <div class="score-box">${m.scoreHome} - ${m.scoreAway}</div>
                            <div style="font-size:0.8rem; color:var(--text-sub); text-align:center;">⏰ ${m.time}</div>
                        </div>
                        <div class="team away"><span>${m.awayTeam}</span> <img src="${m.awayLogo}"></div>
                    </div>
                    <div class="match-broadcast">
                        <span>${m.channel}</span>
                    </div>
                </div>
            `).join('');

            card.innerHTML = `<div class="league-header"><img src="${league.logo}"> <span>🏆 ${league.name}</span></div>${matchesHTML}`;
            container.appendChild(card);
        });
    }

    // Modal
    function openMatchModal(id, home, away) {
        const modal = document.getElementById('stats-modal');
        const body = document.getElementById('modal-body-content');
        body.innerHTML = `
            <h2 style="color:var(--neon-cyan); text-align:center; margin-bottom:15px;">📊 تفاصيل المباراة</h2>
            <p style="text-align:center; color:var(--neon-green); font-size:1.2rem; font-weight:bold;">${home} vs ${away}</p>
            <div style="margin-top:20px; text-align:center; color:var(--text-sub);">جاري استخراج إحصائيات الاستحواذ والتسديدات...</div>
        `;
        modal.classList.add('active');
    }

    function closeModal() { document.getElementById('stats-modal').classList.remove('active'); }

    // Date Logic
    function selectToday() {
        currentDate = new Date();
        const dateStr = formatDate(currentDate);
        document.getElementById('custom-date-picker').value = dateStr;
        fetchMatchesForDate(dateStr);
    }

    function changeDateRelative(days) {
        currentDate.setDate(currentDate.getDate() + days);
        const dateStr = formatDate(currentDate);
        document.getElementById('custom-date-picker').value = dateStr;
        fetchMatchesForDate(dateStr);
    }

    function selectCustomDate(dateVal) {
        if (!dateVal) return;
        currentDate = new Date(dateVal);
        fetchMatchesForDate(dateVal);
    }

    selectToday();
</script>

</body>
</html>
