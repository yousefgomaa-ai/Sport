<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مواعيد المباريات المباشرة</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #22c55e;
            --text-color: #f8fafc;
            --sub-text: #94a3b8;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: var(--accent-color);
            margin-bottom: 5px;
            font-size: 1.8rem;
        }

        .status-bar {
            text-align: center;
            color: var(--sub-text);
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .league-section {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .league-header {
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 15px;
            color: var(--accent-color);
            font-weight: bold;
        }

        .league-header img {
            width: 25px;
            height: 25px;
            object-fit: contain;
        }

        .match-card {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            background: #0f172a;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            gap: 10px;
        }

        .team {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .team.home { justify-content: flex-start; }
        .team.away { justify-content: flex-end; }

        .team img {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        .match-center {
            text-align: center;
            background: var(--card-bg);
            padding: 6px 14px;
            border-radius: 6px;
            min-width: 90px;
        }

        .match-score {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .match-status {
            font-size: 0.75rem;
            color: var(--sub-text);
            margin-top: 2px;
        }

        .loading, .error-msg {
            text-align: center;
            padding: 40px;
            color: var(--sub-text);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>⚽ مباريات اليوم التلقائية</h1>
        <p id="current-date"></p>
    </header>

    <div class="status-bar" id="status-bar">جاري التحديث والتأكد من البيانات...</div>

    <div id="matches-container">
        <div class="loading">⏳ جاري جلب أحدث المباريات من السيرفر...</div>
    </div>
</div>

<script>
    // 1. ضع مفتاح API الخاص بك هنا (مجاني من موقع API-Football)
    const API_KEY = "حط_المفتاح_بتاعك_هنا";

    // عرض تاريخ اليوم بتوقيت القاهرة
    const today = new Date();
    const formattedDate = today.toISOString().split('T')[0];
    
    document.getElementById('current-date').innerText = today.toLocaleDateString('ar-EG', {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });

    async function fetchMatchesAutomatically() {
        const container = document.getElementById('matches-container');
        const statusBar = document.getElementById('status-bar');

        try {
            const response = await fetch(`https://v3.football.api-sports.io/fixtures?date=${formattedDate}`, {
                method: "GET",
                headers: {
                    "x-rapidapi-host": "v3.football.api-sports.io",
                    "x-rapidapi-key": API_KEY
                }
            });

            const result = await response.json();

            if (!result.response || result.response.length === 0) {
                container.innerHTML = '<div class="loading">لا توجد مباريات مسجلة اليوم.</div>';
                statusBar.innerText = 'آخر تحديث: الآن';
                return;
            }

            // تجميع المباريات أوتوماتيكياً حسب الدوري/البطولة
            const groupedLeagues = {};
            
            result.response.forEach(item => {
                const leagueName = item.league.name;
                if (!groupedLeagues[leagueName]) {
                    groupedLeagues[leagueName] = {
                        logo: item.league.logo,
                        matches: []
                    };
                }
                
                // تحويل الوقت لتوقيت جهاز المستخدم
                const matchTime = new Date(item.fixture.date).toLocaleTimeString('ar-EG', {
                    hour: '2-digit', minute: '2-digit'
                });

                // حالة المباراة (مباشر / انتهت / لم تبدأ)
                let statusText = item.fixture.status.long;
                if (item.fixture.status.short === 'NS') statusText = 'لم تبدأ';
                else if (item.fixture.status.short === 'FT') statusText = 'انتهت';
                else if (['1H', '2H', 'HT'].includes(item.fixture.status.short)) statusText = `مباشر (${item.fixture.status.elapsed}')`;

                groupedLeagues[leagueName].matches.push({
                    homeTeam: item.teams.home.name,
                    homeLogo: item.teams.home.logo,
                    awayTeam: item.teams.away.name,
                    awayLogo: item.teams.away.logo,
                    scoreHome: item.goals.home ?? '-',
                    scoreAway: item.goals.away ?? '-',
                    time: matchTime,
                    status: statusText,
                    isLive: ['1H', '2H', 'HT'].includes(item.fixture.status.short)
                });
            });

            // بناء الواجهة تلقائياً
            container.innerHTML = '';
            for (const [leagueName, leagueData] of Object.entries(groupedLeagues)) {
                const leagueCard = document.createElement('div');
                leagueCard.className = 'league-section';

                const matchesHTML = leagueData.matches.map(m => `
                    <div class="match-card">
                        <div class="team home">
                            <img src="${m.homeLogo}" alt="${m.homeTeam}" loading="lazy">
                            <span>${m.homeTeam}</span>
                        </div>
                        <div class="match-center">
                            <div class="match-score">${m.scoreHome} - ${m.scoreAway}</div>
                            <div class="match-status" style="${m.isLive ? 'color:#22c55e; font-weight:bold;' : ''}">${m.isLive ? '🔴 ' : ''}${m.status} | ${m.time}</div>
                        </div>
                        <div class="team away">
                            <span>${m.awayTeam}</span>
                            <img src="${m.awayLogo}" alt="${m.awayTeam}" loading="lazy">
                        </div>
                    </div>
                `).join('');

                leagueCard.innerHTML = `
                    <div class="league-header">
                        <img src="${leagueData.logo}" alt="${leagueName}">
                        <span>${leagueName}</span>
                    </div>
                    ${matchesHTML}
                `;
                container.appendChild(leagueCard);
            }

            statusBar.innerText = `تم التحديث تلقائياً الساعة: ${new Date().toLocaleTimeString('ar-EG')}`;

        } catch (error) {
            container.innerHTML = '<div class="error-msg">حدث خطأ أثناء جلب البيانات. تأكد من مفتاح الـ API والتوصيل بالإنترنت.</div>';
            console.error(error);
        }
    }

    // تشغيل جلب البيانات عند فتح الصفحة
    fetchMatchesAutomatically();

    // تحديث تلقائي كل 60 ثانية لجلب النتيجة والمباريات المباشرة لحظة بلحظة
    setInterval(fetchMatchesAutomatically, 60000);
</script>

</body>
</html>
