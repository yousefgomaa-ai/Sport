<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FT MATCHES - Live Football</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #07090e;
            --card-bg: rgba(18, 26, 38, 0.75);
            --neon-cyan: #00f2fe;
            --neon-pink: #ff007f;
            --text-main: #f0f4f8;
            --text-sub: #8a99ad;
            --border-glow: rgba(0, 242, 254, 0.2);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        header {
            background: rgba(7, 9, 14, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky; top: 0; z-index: 1000;
            padding: 15px 5%;
            display: flex; justify-content: space-between; align-items: center;
        }

        .brand {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem; font-weight: 900;
            color: var(--neon-cyan);
            text-decoration: none;
        }

        .nav-links { display: flex; gap: 12px; }

        .nav-btn {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-sub);
            padding: 8px 14px; border-radius: 8px;
            cursor: pointer; font-weight: 700;
        }

        .nav-btn.active {
            background: rgba(0, 242, 254, 0.1);
            color: var(--neon-cyan);
            border-color: var(--neon-cyan);
        }

        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }

        .stream-container {
            display: none;
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 16px; padding: 20px; margin-bottom: 30px;
        }

        .action-box {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--neon-pink);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        .play-link-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 12px 25px;
            background: var(--neon-pink);
            color: #fff;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
        }

        .channel-selector {
            display: flex; gap: 10px; margin-top: 15px;
            flex-wrap: wrap; max-height: 300px; overflow-y: auto;
        }

        .channel-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 10px 16px; border-radius: 8px;
            cursor: pointer; font-weight: bold;
            display: flex; align-items: center; gap: 8px;
        }

        .channel-btn:hover, .channel-btn.active {
            background: var(--neon-cyan);
            color: #000;
        }

        .search-box { position: relative; margin-bottom: 25px; }
        .search-box input {
            width: 100%; padding: 15px 20px;
            background: var(--card-bg); border: 1px solid var(--glass-border);
            border-radius: 12px; color: var(--text-main); outline: none;
        }

        .match-card {
            background: var(--card-bg); border: 1px solid var(--glass-border);
            border-radius: 12px; padding: 15px 20px; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .team { display: flex; align-items: center; gap: 12px; flex: 1; font-weight: bold; }
        .team.home { justify-content: flex-end; }
        .team.away { justify-content: flex-start; }
        .team img { width: 32px; height: 32px; }

        .score-info { text-align: center; padding: 0 20px; }
        .score { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; color: var(--neon-cyan); }
        .league-title {
            background: rgba(255, 255, 255, 0.03); border-right: 4px solid var(--neon-cyan);
            padding: 10px 15px; margin: 25px 0 15px 0; font-weight: 700;
            display: flex; align-items: center; gap: 10px;
        }
        .league-title img { width: 24px; height: 24px; }
    </style>
</head>
<body>

    <header>
        <a href="#" class="brand"><i class="fa-solid fa-gamepad"></i> FT MATCHES</a>
        <div class="nav-links">
            <button class="nav-btn active" id="btn-tab-matches" onclick="switchView('matches')">المباريات</button>
            <button class="nav-btn" id="btn-tab-live" onclick="switchView('live')">البث المباشر</button>
        </div>
    </header>

    <div class="container">
        
        <div id="live-stream-section" class="stream-container">
            <div class="action-box">
                <h3 id="selected-ch-name" style="color: var(--neon-cyan);">اختر قناة للتشغيل</h3>
                <p style="font-size: 0.85rem; color: var(--text-sub); margin-top: 5px;">اضغط على الزر أدناه للفتح المباشر عبر مشغل الموبايل تلقائياً بدون مشاكل حظر المتصفح:</p>
                <div id="play-area" style="margin-top: 15px;"></div>
            </div>

            <p style="color: var(--neon-cyan); font-weight: bold;">📺 قائمة قنوات السيرفر:</p>
            <div class="channel-selector" id="channels-list"></div>
        </div>

        <div id="matches-section">
            <div class="search-box">
                <input type="text" id="team-search" placeholder="ابحث عن فريق..." onkeyup="handleSearch(event)">
            </div>
            <div id="main-content"></div>
        </div>

    </div>

    <script>
        const API_KEY = "38bc32a76f2aa46d5c07aa8856358c0c"; 
        
        const CHANNELS = [
            { name: "beIN SPORTS Full HD 1", url: "http://ugeen.live:8080/Ugeen_VIPEJJQ1Q/LKGkwD/3221" },
            { name: "beIN SPORTS Full HD 2", url: "http://ugeen.live:8080/Ugeen_VIPEJJQ1Q/LKGkwD/3222" },
            { name: "beIN SPORTS Full HD 3", url: "http://ugeen.live:8080/Ugeen_VIPEJJQ1Q/LKGkwD/3224" },
            { name: "beIN SPORTS Full HD 4", url: "http://ugeen.live:8080/Ugeen_VIPEJJQ1Q/LKGkwD/3225" },
            { name: "beIN SPORTS Full HD 5", url: "http://ugeen.live:8080/Ugeen_VIPEJJQ1Q/LKGkwD/3226" },
            { name: "beIN SPORTS 1 ᴴᴰ", url: "http://ugeen.live:8080/Ugeen_VIPEJJQ1Q/LKGkwD/46" },
            { name: "beIN SPORTS 2 ᴴᴰ", url: "http://ugeen.live:8080/Ugeen_VIPEJJQ1Q/LKGkwD/47" },
            { name: "beIN SPORTS 3 ᴴᴰ", url: "http://ugeen.live:8080/Ugeen_VIPEJJQ1Q/LKGkwD/49" },
            { name: "beIN SPORTS News", url: "http://ugeen.live:8080/Ugeen_VIPEJJQ1Q/LKGkwD/2051" }
        ];

        let currentDate = new Date().toISOString().split('T')[0];

        document.addEventListener("DOMContentLoaded", () => {
            fetchMatchesForDate(currentDate);
            renderChannels();
        });

        function switchView(view) {
            document.getElementById('live-stream-section').style.display = view === 'live' ? 'block' : 'none';
            document.getElementById('matches-section').style.display = view === 'matches' ? 'block' : 'none';
            document.getElementById('btn-tab-live').classList.toggle('active', view === 'live');
            document.getElementById('btn-tab-matches').classList.toggle('active', view === 'matches');
        }

        function renderChannels() {
            const container = document.getElementById('channels-list');
            container.innerHTML = "";

            CHANNELS.forEach((ch) => {
                const btn = document.createElement('button');
                btn.className = 'channel-btn';
                btn.innerHTML = `<i class="fa-solid fa-play"></i> ${ch.name}`;
                btn.onclick = () => selectChannel(ch);
                container.appendChild(btn);
            });
        }

        function selectChannel(ch) {
            document.getElementById('selected-ch-name').innerText = ch.name;
            const playArea = document.getElementById('play-area');

            // رابط Intent المباشر لأجهزة أندرويد لفتح أي مشغل بث فوري بدون أخطاء CORS
            const rawUrl = ch.url;
            const intentUrl = `intent:${rawUrl}#Intent;type=video/*;scheme=http;end`;

            playArea.innerHTML = `
                <a href="${intentUrl}" class="play-link-btn">▶ تشغيل القناة فوراً (Intent Stream)</a>
                <br><br>
                <a href="${rawUrl}" target="_blank" style="color:var(--neon-cyan); font-size:0.85rem;">أو افتح الرابط المباشر في تبويب جديد</a>
            `;
        }

        async function fetchMatchesForDate(targetDateStr) {
            const container = document.getElementById('main-content');
            container.innerHTML = `<div style="text-align:center; padding:30px;">⚡ جاري تحميل المباريات...</div>`;

            try {
                const response = await fetch(`https://v3.football.api-sports.io/fixtures?date=${targetDateStr}`, {
                    method: "GET",
                    headers: { "x-apisports-key": API_KEY }
                });
                const result = await response.json();
                if (!result.response || result.response.length === 0) {
                    container.innerHTML = `<div style="text-align:center; padding:30px;">🚫 لا توجد مباريات اليوم.</div>`;
                    return;
                }
                renderMatchGroups(result.response, container);
            } catch (error) {
                container.innerHTML = `<div style="text-align:center; padding:30px; color:var(--neon-pink);">⚠️ خطأ في التحميل</div>`;
            }
        }

        function renderMatchGroups(fixtures, container) {
            container.innerHTML = "";
            const leagues = {};
            fixtures.forEach(item => {
                const name = item.league.name;
                if (!leagues[name]) leagues[name] = { logo: item.league.logo, matches: [] };
                leagues[name].matches.push(item);
            });

            for (const [name, data] of Object.entries(leagues)) {
                let html = `<div class="league-title"><img src="${data.logo || ''}"> <span>${name}</span></div>`;
                data.matches.forEach(m => {
                    let isLive = ["1H", "HT", "2H", "ET", "P"].includes(m.fixture.status.short);
                    let time = new Date(m.fixture.date).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    html += `
                        <div class="match-card">
                            <div class="team home"><span>${m.teams.home.name}</span> <img src="${m.teams.home.logo}"></div>
                            <div class="score-info">
                                <div class="score">${m.goals.home ?? '-'} : ${m.goals.away ?? '-'}</div>
                                <div style="font-size:0.8rem; color:${isLive ? 'var(--neon-pink)' : 'var(--text-sub)'}">${isLive ? '🔴 مباشر' : time}</div>
                            </div>
                            <div class="team away"><img src="${m.teams.away.logo}"> <span>${m.teams.away.name}</span></div>
                        </div>
                    `;
                });
                container.innerHTML += html;
            }
        }

        function handleSearch(event) {
            const query = event.target.value.toLowerCase().trim();
            document.querySelectorAll('.match-card').forEach(card => {
                card.style.display = card.innerText.toLowerCase().includes(query) ? 'flex' : 'none';
            });
        }
    </script>
</body>
</html>
