<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Football Hub</title>
    <style>
        :root {
            --bg-dark: #0a0e17;
            --card-bg: #121824;
            --neon-green: #00ff88;
            --neon-cyan: #00e5ff;
            --neon-pink: #ff0055;
            --text-main: #ffffff;
            --text-sub: #a0aec0;
            --border-color: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(18, 24, 36, 0.95);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--neon-green);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        nav {
            display: flex;
            gap: 15px;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-sub);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .nav-btn.active, .nav-btn:hover {
            color: var(--neon-cyan);
            border-color: var(--neon-cyan);
            background: rgba(0, 229, 255, 0.05);
        }

        .lang-btn {
            background: var(--neon-green);
            color: #000;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
            flex-grow: 1;
            width: 100%;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        select {
            background: var(--bg-dark);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 15px;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .match-card, .news-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
            transition: transform 0.2s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .match-card:hover, .news-card:hover {
            transform: translateY(-4px);
            border-color: var(--neon-cyan);
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 8px;
        }

        .match-body {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
        }

        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 40%;
            text-align: center;
        }

        .team img {
            width: 45px;
            height: 45px;
            object-fit: contain;
        }

        .score-time {
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--neon-green);
        }

        .status-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .status-live {
            background: rgba(255, 0, 85, 0.2);
            color: var(--neon-pink);
            border: 1px solid var(--neon-pink);
        }

        .status-ft {
            background: rgba(160, 174, 192, 0.1);
            color: var(--text-sub);
        }

        .status-ns {
            background: rgba(0, 255, 136, 0.1);
            color: var(--neon-green);
        }

        /* News Cards Styles */
        .news-source {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--neon-cyan);
            font-size: 0.8rem;
            margin-bottom: 10px;
        }

        .news-title-en {
            font-size: 1.05rem;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            color: var(--text-sub);
            font-size: 0.85rem;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            ⚽ <span id="app-title">RealTime Football Hub</span>
        </div>
        <nav>
            <button class="nav-btn active" id="nav-matches" onclick="showMatchesPage()">المباريات</button>
            <button class="nav-btn" id="nav-news" onclick="showNewsPage()">الأخبار المباشرة</button>
        </nav>
        <button class="lang-btn" onclick="toggleLanguage()" id="lang-btn">English</button>
    </header>

    <div class="container">
        <div class="controls" id="controls-section">
            <div>
                <label id="lbl-league" for="league-select">الدوري: </label>
                <select id="league-select" onchange="filterMatches()">
                    <option value="ALL">كل البطولات</option>
                    <option value="CL">دوري أبطال أوروبا</option>
                    <option value="PL">الدوري الإنجليزي</option>
                    <option value="PD">الدوري الإسباني</option>
                    <option value="SA">الدوري الإيطالي</option>
                </select>
            </div>
            <div>
                <label id="lbl-status" for="status-select">الحالة: </label>
                <select id="status-select" onchange="filterMatches()">
                    <option value="ALL">الكل</option>
                    <option value="LIVE">مباشر الآن</option>
                    <option value="FINISHED">انتهت</option>
                    <option value="TIMED">قادمة</option>
                </select>
            </div>
        </div>

        <div id="main-content" class="grid-container">
            <!-- Dynamic Content Injected via JS -->
        </div>
    </div>

    <footer>
        <p id="footer-text">© 2026 Live Football Hub - تحديثات لحظية ومباشرة من المصادر العالمية</p>
    </footer>

    <script>
        let currentLang = 'ar';
        let matchesData = [];

        // --- Mock Data for Matches (Real API Key Can Replace This) ---
        const sampleMatches = [
            {
                id: 1,
                league: 'PL',
                leagueNameAr: 'الدوري الإنجليزي',
                leagueNameEn: 'Premier League',
                homeTeamAr: 'مانشستر سيتي',
                homeTeamEn: 'Man City',
                homeLogo: 'https://crests.football-data.org/65.png',
                awayTeamAr: 'أرسنال',
                awayTeamEn: 'Arsenal',
                awayLogo: 'https://crests.football-data.org/57.png',
                score: '2 - 1',
                time: "75'",
                status: 'LIVE'
            },
            {
                id: 2,
                league: 'PD',
                leagueNameAr: 'الدوري الإسباني',
                leagueNameEn: 'La Liga',
                homeTeamAr: 'ريال مدريد',
                homeTeamEn: 'Real Madrid',
                homeLogo: 'https://crests.football-data.org/86.png',
                awayTeamAr: 'برشلونة',
                awayTeamEn: 'FC Barcelona',
                awayLogo: 'https://crests.football-data.org/81.png',
                score: '0 - 0',
                time: '21:00',
                status: 'TIMED'
            },
            {
                id: 3,
                league: 'CL',
                leagueNameAr: 'دوري أبطال أوروبا',
                leagueNameEn: 'Champions League',
                homeTeamAr: 'بايرن ميونخ',
                homeTeamEn: 'Bayern Munich',
                homeLogo: 'https://crests.football-data.org/5.png',
                awayTeamAr: 'باريس سان جيرمان',
                awayTeamEn: 'PSG',
                awayLogo: 'https://crests.football-data.org/524.png',
                score: '3 - 2',
                time: 'FT',
                status: 'FINISHED'
            }
        ];

        function initApp() {
            matchesData = sampleMatches;
            showMatchesPage();
        }

        function showMatchesPage() {
            setActiveNav('nav-matches');
            document.getElementById('controls-section').style.display = 'flex';
            filterMatches();
        }

        function renderMatches(data) {
            const container = document.getElementById('main-content');
            container.innerHTML = '';

            if(data.length === 0) {
                container.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 40px; color: var(--text-sub);">
                    ${currentLang === 'ar' ? 'لا توجد مباريات مطابقة للبحث' : 'No matches found'}
                </div>`;
                return;
            }

            data.forEach(m => {
                const homeName = currentLang === 'ar' ? m.homeTeamAr : m.homeTeamEn;
                const awayName = currentLang === 'ar' ? m.awayTeamAr : m.awayTeamEn;
                const leagueName = currentLang === 'ar' ? m.leagueNameAr : m.leagueNameEn;
                
                let statusBadge = '';
                if(m.status === 'LIVE') {
                    statusBadge = `<span class="status-badge status-live">🔴 ${m.time}</span>`;
                } else if(m.status === 'FINISHED') {
                    statusBadge = `<span class="status-badge status-ft">${currentLang === 'ar' ? 'انتهت' : 'FT'}</span>`;
                } else {
                    statusBadge = `<span class="status-badge status-ns">${m.time}</span>`;
                }

                container.innerHTML += `
                    <div class="match-card">
                        <div class="match-header">
                            <span>🏆 ${leagueName}</span>
                            ${statusBadge}
                        </div>
                        <div class="match-body">
                            <div class="team">
                                <img src="${m.homeLogo}" alt="${homeName}" onerror="this.src='https://via.placeholder.com/45'">
                                <span>${homeName}</span>
                            </div>
                            <div class="score-time">
                                ${m.status === 'TIMED' ? 'VS' : m.score}
                            </div>
                            <div class="team">
                                <img src="${m.awayLogo}" alt="${awayName}" onerror="this.src='https://via.placeholder.com/45'">
                                <span>${awayName}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function filterMatches() {
            const leagueFilter = document.getElementById('league-select').value;
            const statusFilter = document.getElementById('status-select').value;

            let filtered = matchesData.filter(m => {
                const matchLeague = (leagueFilter === 'ALL' || m.league === leagueFilter);
                const matchStatus = (statusFilter === 'ALL' || m.status === statusFilter);
                return matchLeague && matchStatus;
            });

            renderMatches(filtered);
        }

        // --- DYNAMIC LIVE NEWS SYSTEM (Fetch Live Headlines) ---
        async function showNewsPage() {
            setActiveNav('nav-news');
            document.getElementById('controls-section').style.display = 'none';
            const container = document.getElementById('main-content');

            const newsTitle = currentLang === "en" ? "📰 Live Updated Football News" : "📰 أحدث الأخبار الرياضية المباشرة (تحديث لحظي)";
            const loadingText = currentLang === "en" ? "⚡ Fetching latest sports headlines..." : "⚡ جاري جلب أحدث الأخبار الرياضية من المصادر العالمية...";

            container.innerHTML = `
                <div style="grid-column: 1/-1;">
                    <h2 style="color: var(--neon-cyan); margin-bottom: 20px;">${newsTitle}</h2>
                </div>
                <div id="news-container-grid" style="grid-column: 1/-1;" class="grid-container">
                    <div style="grid-column: 1/-1; text-align:center; padding:40px; color:var(--neon-cyan);">${loadingText}</div>
                </div>
            `;

            try {
                // Fetching real-time sports headlines from API
                const newsResponse = await fetch('https://saurav.tech/NewsAPI/top-headlines/category/sports/in.json');
                const newsData = await newsResponse.json();
                
                const newsGrid = document.getElementById('news-container-grid');
                newsGrid.innerHTML = '';

                if (newsData.articles && newsData.articles.length > 0) {
                    // Display top 8 real-time articles
                    newsData.articles.slice(0, 8).forEach(article => {
                        const publishedTime = new Date(article.publishedAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                        const sourceName = article.source.name || "Verified Sports Source";
                        
                        newsGrid.innerHTML += `
                            <div class="news-card">
                                <div>
                                    <div class="news-source">
                                        <span>✔️ ${sourceName}</span>
                                        <span style="font-size:0.75rem; color:var(--text-sub); margin-left:auto; margin-right:auto;">🕒 ${publishedTime}</span>
                                    </div>
                                    <h3 class="news-title-en">${article.title}</h3>
                                    <p style="font-size:0.85rem; color:var(--text-sub); margin-bottom: 15px;">
                                        ${article.description || (currentLang === 'en' ? 'Click below to read full coverage.' : 'اضغط للانتشار وقراءة التغطية الكاملة من المصدر.')}
                                    </p>
                                </div>
                                <a href="${article.url}" target="_blank" style="color:var(--neon-green); text-decoration:none; font-size:0.85rem; font-weight:bold; display:inline-block;">
                                    ${currentLang === 'en' ? 'Read Full Source ↗' : 'قراءة الخبر من المصدر الأصلي ↗'}
                                </a>
                            </div>
                        `;
                    });
                } else {
                    newsGrid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color:var(--text-sub);">لا توجد أخبار جديدة في هذه اللحظة.</div>`;
                }
            } catch (error) {
                document.getElementById('news-container-grid').innerHTML = 
                    '<div style="grid-column: 1/-1; text-align:center; color:var(--neon-pink); padding:30px;">فشل في جلب الأخبار الحية، يرجى المحاولة لاحقاً.</div>';
            }
        }

        function setActiveNav(navId) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(navId).classList.add('active');
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            
            // Update UI Texts
            document.getElementById('lang-btn').innerText = currentLang === 'ar' ? 'English' : 'عربي';
            document.getElementById('nav-matches').innerText = currentLang === 'ar' ? 'المباريات' : 'Matches';
            document.getElementById('nav-news').innerText = currentLang === 'ar' ? 'الأخبار المباشرة' : 'Live News';
            document.getElementById('lbl-league').innerText = currentLang === 'ar' ? 'الدوري: ' : 'League: ';
            document.getElementById('lbl-status').innerText = currentLang === 'ar' ? 'الحالة: ' : 'Status: ';
            document.getElementById('footer-text').innerText = currentLang === 'ar' 
                ? '© 2026 Live Football Hub - تحديثات لحظية ومباشرة من المصادر العالمية' 
                : '© 2026 Live Football Hub - Real-time updates from verified global sources';

            // Refresh current view
            if(document.getElementById('nav-matches').classList.contains('active')) {
                filterMatches();
            } else {
                showNewsPage();
            }
        }

        // Initialize App on load
        window.onload = initApp;
    </script>
</body>
</html>
