<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FT MATCHES - Live Football & Streaming</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-dark: #07090e;
            --card-bg: rgba(18, 26, 38, 0.75);
            --neon-cyan: #00f2fe;
            --neon-pink: #ff007f;
            --text-main: #f0f4f8;
            --text-sub: #8a99ad;
            --border-glow: rgba(0, 242, 254, 0.2);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 242, 254, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(255, 0, 127, 0.05) 0%, transparent 40%);
            background-attachment: fixed;
            padding-bottom: 50px;
        }

        header {
            background: rgba(7, 9, 14, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky; top: 0; z-index: 1000;
            padding: 15px 5%;
            display: flex; justify-content: space-between; align-items: center;
        }

        .brand {
            display: flex; align-items: center; gap: 12px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem; font-weight: 900;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
            text-decoration: none;
        }

        .nav-links { display: flex; gap: 12px; align-items: center; }

        .nav-btn {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-sub);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s;
            display: flex; align-items: center; gap: 6px; font-size: 0.9rem;
        }

        .nav-btn:hover { color: var(--neon-cyan); border-color: var(--neon-cyan); }

        .nav-btn.active {
            background: rgba(0, 242, 254, 0.1);
            color: var(--neon-cyan);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }

        .nav-btn.live-btn.active {
            background: rgba(255, 0, 127, 0.15);
            color: var(--neon-pink);
            border-color: var(--neon-pink);
            box-shadow: 0 0 12px rgba(255, 0, 127, 0.4);
        }

        .lang-btn {
            background: transparent; border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan); padding: 6px 12px;
            border-radius: 8px; cursor: pointer; font-weight: bold;
        }

        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }

        .stream-container {
            display: none;
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 16px; padding: 20px; margin-bottom: 30px;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.1);
        }

        .player-wrapper {
            position: relative; padding-top: 56.25%;
            background: #000; border-radius: 12px; overflow: hidden;
            border: 1px solid var(--glass-border);
        }

        .player-wrapper video {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; border: none;
        }

        .channel-selector {
            display: flex; gap: 10px; margin-top: 15px;
            overflow-x: auto; padding-bottom: 8px;
            max-height: 200px;
            flex-wrap: wrap;
        }

        .channel-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 8px 16px; border-radius: 8px;
            cursor: pointer; font-weight: bold; white-space: nowrap; transition: 0.3s;
            font-size: 0.85rem;
        }

        .channel-btn:hover, .channel-btn.active {
            background: var(--neon-pink);
            border-color: var(--neon-pink);
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
        }

        .search-box { position: relative; margin-bottom: 25px; }

        .search-box input {
            width: 100%; padding: 15px 20px; padding-right: 45px;
            background: var(--card-bg); border: 1px solid var(--glass-border);
            border-radius: 12px; color: var(--text-main); outline: none;
        }

        .search-box i {
            position: absolute; right: 15px; top: 50%;
            transform: translateY(-50%); color: var(--text-sub);
        }

        .date-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card-bg); border: 1px solid var(--glass-border);
            border-radius: 12px; padding: 10px; margin-bottom: 30px; flex-wrap: wrap; gap: 10px;
        }

        .date-btn {
            background: transparent; border: 1px solid transparent;
            color: var(--text-sub); padding: 8px 16px; border-radius: 8px;
            cursor: pointer; font-weight: bold;
        }

        .date-btn:hover, .date-btn.active {
            background: rgba(0, 242, 254, 0.1);
            color: var(--neon-cyan); border-color: var(--neon-cyan);
        }

        .date-picker {
            background: var(--bg-dark); border: 1px solid var(--glass-border);
            color: var(--text-main); padding: 8px 12px; border-radius: 8px;
        }

        .league-title {
            background: rgba(255, 255, 255, 0.03); border-right: 4px solid var(--neon-cyan);
            padding: 10px 15px; margin: 25px 0 15px 0; border-radius: 4px;
            display: flex; align-items: center; gap: 10px; font-weight: 700;
        }

        .league-title img { width: 24px; height: 24px; object-fit: contain; }

        .match-card {
            background: var(--card-bg); border: 1px solid var(--glass-border);
            border-radius: 12px; padding: 15px 20px; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .team { display: flex; align-items: center; gap: 12px; flex: 1; font-weight: bold; }
        .team.home { justify-content: flex-end; text-align: left; }
        .team.away { justify-content: flex-start; text-align: right; }
        .team img { width: 32px; height: 32px; object-fit: contain; }

        .score-info { display: flex; flex-direction: column; align-items: center; padding: 0 20px; min-width: 120px; }
        .score { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; font-weight: 900; color: var(--neon-cyan); }
        .status { font-size: 0.8rem; color: var(--text-sub); margin-top: 4px; }
        .status.live { color: var(--neon-pink); font-weight: bold; }

        .msg-box { text-align: center; padding: 50px 20px; color: var(--text-sub); }
        .err-box { text-align: center; padding: 40px 20px; color: var(--neon-pink); font-weight: bold; background: rgba(255, 0, 127, 0.05); border: 1px solid rgba(255, 0, 127, 0.2); border-radius: 12px; }
    </style>
</head>
<body>

    <header>
        <a href="#" class="brand"><i class="fa-solid fa-gamepad"></i> FT MATCHES</a>
        <div class="nav-links">
            <button class="nav-btn active" id="btn-tab-matches" onclick="switchView('matches')">
                <i class="fa-solid fa-calendar-days"></i> المباريات
            </button>
            <button class="nav-btn live-btn" id="btn-tab-live" onclick="switchView('live')">
                <i class="fa-solid fa-tv"></i> البث المباشر
            </button>
            <button class="lang-btn" id="lang-toggle" onclick="toggleLanguage()">العربية</button>
        </div>
    </header>

    <div class="container">
        
        <!-- قسم البث المباشر -->
        <div id="live-stream-section" class="stream-container">
            <h3 style="margin-bottom: 15px; color: var(--neon-pink); display: flex; align-items: center; gap: 8px;">
                <i class="fa-solid fa-circle-play"></i> قنوات البث المباشر
            </h3>
            
            <div class="player-wrapper">
                <video id="video-player" controls playsinline></video>
            </div>

            <!-- مكان القنوات اللي هتيجي بالأسماء والـ Stream ID الحقيقي -->
            <div style="margin-top: 15px;">
                <p style="font-size: 0.9rem; color: var(--neon-cyan); margin-bottom: 8px;">📺 القنوات المتاحة من السيرفر:</p>
                <div class="channel-selector" id="channels-list">
                    <div style="color: var(--text-sub); font-size: 0.9rem;">⚡ جاري قراءة القنوات والأسماء من السيرفر...</div>
                </div>
            </div>
        </div>

        <!-- قسم المباريات الرئيسي -->
        <div id="matches-section">
            <div class="search-box">
                <input type="text" id="team-search" placeholder="ابحث عن فريق (مثل: ريال مدريد، الأهلي)..." onkeyup="handleSearch(event)">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>

            <div class="date-bar">
                <button class="date-btn" onclick="changeDate(-1)">⬅️ الأمس</button>
                <button class="date-btn active" id="btn-today" onclick="loadToday()">🎮 اليوم</button>
                <button class="date-btn" onclick="changeDate(1)">غداً ➡️</button>
                <div>
                    <label style="color:var(--text-sub); font-size:0.9rem;">التاريخ: </label>
                    <input type="date" id="custom-date" class="date-picker" onchange="onCustomDateSelect(this.value)">
                </div>
            </div>

            <div id="main-content"></div>
        </div>

    </div>

    <script>
        const API_KEY = "38bc32a76f2aa46d5c07aa8856358c0c"; 
        
        // بيانات Xtream الخاصة بك
        const SERVER_URL = "http://ugeen.live:8080";
        const USERNAME = "Ugeen_VIPEJJQ1Q";
        const PASSWORD = "LKGkwD";

        let currentLang = "ar";
        let currentDate = new Date().toISOString().split('T')[0];
        let hlsPlayer = null;
        let isChannelsLoaded = false;

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('custom-date').value = currentDate;
            fetchMatchesForDate(currentDate);
        });

        function switchView(view) {
            const liveSection = document.getElementById('live-stream-section');
            const matchesSection = document.getElementById('matches-section');
            const btnMatches = document.getElementById('btn-tab-matches');
            const btnLive = document.getElementById('btn-tab-live');
            const video = document.getElementById('video-player');

            if (view === 'live') {
                liveSection.style.display = 'block';
                matchesSection.style.display = 'none';
                btnLive.classList.add('active');
                btnMatches.classList.remove('active');

                // جلب قنوات السيرفر بالأسماء الحقيقية أول ما يدوس على البث المباشر
                if (!isChannelsLoaded) {
                    fetchRealXtreamChannels();
                    isChannelsLoaded = true;
                }
            } else {
                liveSection.style.display = 'none';
                matchesSection.style.display = 'block';
                btnMatches.classList.add('active');
                btnLive.classList.remove('active');

                if (video) video.pause();
            }
        }

        // دالة جلب القنوات والأسماء الحقيقية عبر الـ Xtream API
        async function fetchRealXtreamChannels() {
            const container = document.getElementById('channels-list');
            const apiUrl = `${SERVER_URL}/player_api.php?username=${USERNAME}&password=${PASSWORD}&action=get_live_streams`;
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(apiUrl)}`;

            try {
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error("CORS or Connection issue");
                const data = await response.json();
                const channels = JSON.parse(data.contents);

                if (!Array.isArray(channels) || channels.length === 0) {
                    throw new Error("No streams returned");
                }

                container.innerHTML = "";

                // عرض أول 30 قناة رياضية لسرعة التحميل
                let count = 0;
                channels.forEach((ch) => {
                    const chName = ch.name || "قناة بدون اسم";
                    const streamId = ch.stream_id;

                    // تصفية القنوات لتركيز القنوات الرياضية و beIN
                    if (/bein|sport|ssc|alkass/i.test(chName) && count < 30) {
                        const streamUrl = `${SERVER_URL}/live/${USERNAME}/${PASSWORD}/${streamId}.m3u8`;
                        
                        const btn = document.createElement('button');
                        btn.className = 'channel-btn';
                        btn.innerText = chName;
                        btn.onclick = () => loadStream(streamUrl, btn);
                        container.appendChild(btn);
                        count++;
                    }
                });

                if (container.children.length > 0) {
                    container.children[0].click(); // تشغيل القناة الأولى تلقائياً
                } else {
                    container.innerHTML = `<div style="color:var(--neon-pink);">لم يتم العثور على قنوات رياضية.</div>`;
                }

            } catch (err) {
                console.error("Error fetching Xtream channels:", err);
                container.innerHTML = `<div style="color:var(--neon-pink);">⚠️ تعذر جلب قائمة القنوات تلقائياً. تأكد من بيانات السيرفر.</div>`;
            }
        }

        function loadStream(streamUrl, btn) {
            document.querySelectorAll('#channels-list .channel-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');

            const video = document.getElementById('video-player');

            if (Hls.isSupported()) {
                if (hlsPlayer) hlsPlayer.destroy();
                hlsPlayer = new Hls();
                hlsPlayer.loadSource(streamUrl);
                hlsPlayer.attachMedia(video);
                hlsPlayer.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(e => console.log("Autoplay check:", e));
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = streamUrl;
                video.play().catch(e => console.log("Autoplay check:", e));
            }
        }

        function toggleLanguage() {
            currentLang = currentLang === "ar" ? "en" : "ar";
            document.getElementById('lang-toggle').innerText = currentLang === "ar" ? "العربية" : "English";
            document.dir = currentLang === "ar" ? "rtl" : "ltr";
            fetchMatchesForDate(currentDate);
        }

        function loadToday() {
            currentDate = new Date().toISOString().split('T')[0];
            document.getElementById('custom-date').value = currentDate;
            fetchMatchesForDate(currentDate);
        }

        function changeDate(days) {
            let d = new Date(currentDate);
            d.setDate(d.getDate() + days);
            currentDate = d.toISOString().split('T')[0];
            document.getElementById('custom-date').value = currentDate;
            fetchMatchesForDate(currentDate);
        }

        function onCustomDateSelect(val) {
            if (val) {
                currentDate = val;
                fetchMatchesForDate(currentDate);
            }
        }

        async function fetchMatchesForDate(targetDateStr) {
            const container = document.getElementById('main-content');
            const cacheKey = `ft_matches_${targetDateStr}`;
            const cacheTimeKey = `ft_time_${targetDateStr}`;
            
            const cachedData = localStorage.getItem(cacheKey);
            const cachedTime = localStorage.getItem(cacheTimeKey);
            const now = new Date().getTime();

            if (cachedData && cachedTime && (now - cachedTime < 3600000)) {
                renderMatchGroups(JSON.parse(cachedData), container);
                return;
            }

            container.innerHTML = `<div class="msg-box" style="color: var(--neon-cyan);">⚡ جاري تحميل المباريات...</div>`;

            try {
                const response = await fetch(`https://v3.football.api-sports.io/fixtures?date=${targetDateStr}`, {
                    method: "GET",
                    headers: {
                        "x-apisports-key": API_KEY,
                        "x-rapidapi-key": API_KEY
                    }
                });

                if (!response.ok) throw new Error(`Server status: ${response.status}`);
                const result = await response.json();

                if (!result.response || result.response.length === 0) {
                    container.innerHTML = `<div class="msg-box">🚫 لا توجد مباريات مسجلة بتاريخ (${targetDateStr}).</div>`;
                    return;
                }

                localStorage.setItem(cacheKey, JSON.stringify(result.response));
                localStorage.setItem(cacheTimeKey, now);

                renderMatchGroups(result.response, container);
            } catch (error) {
                if (cachedData) {
                    renderMatchGroups(JSON.parse(cachedData), container);
                    return;
                }
                container.innerHTML = `<div class="err-box">⚠️ انتهت الكوتا اليومية أو حدث خطأ في الاتصال.</div>`;
            }
        }

        function renderMatchGroups(fixtures, container) {
            container.innerHTML = "";
            const leagues = {};
            
            fixtures.forEach(item => {
                const leagueName = item.league.name;
                if (!leagues[leagueName]) {
                    leagues[leagueName] = { logo: item.league.logo, matches: [] };
                }
                leagues[leagueName].matches.push(item);
            });

            for (const [name, data] of Object.entries(leagues)) {
                let html = `
                    <div class="league-title">
                        <img src="${data.logo || ''}" alt="">
                        <span>${name}</span>
                    </div>
                `;

                data.matches.forEach(m => {
                    const statusShort = m.fixture.status.short;
                    let statusText = m.fixture.status.elapsed ? `${m.fixture.status.elapsed}'` : statusShort;
                    let isLive = ["1H", "HT", "2H", "ET", "P"].includes(statusShort);
                    let time = new Date(m.fixture.date).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                    html += `
                        <div class="match-card">
                            <div class="team home">
                                <span>${m.teams.home.name}</span>
                                <img src="${m.teams.home.logo}" alt="">
                            </div>
                            <div class="score-info">
                                <div class="score">${m.goals.home ?? '-'} : ${m.goals.away ?? '-'}</div>
                                <div class="status ${isLive ? 'live' : ''}">${isLive ? '🔴 بث مباشر ' + statusText : time}</div>
                            </div>
                            <div class="team away">
                                <img src="${m.teams.away.logo}" alt="">
                                <span>${m.teams.away.name}</span>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML += html;
            }
        }

        function handleSearch(event) {
            const query = event.target.value.toLowerCase().trim();
            document.querySelectorAll('.match-card').forEach(card => {
                card.style.display = card.innerText.toLowerCase().includes(query) ? 'flex' : 'none';
            });
        }
    </script>
</body>
</html>
