<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FT MATCHES - Live Football Hub</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #07090e;
            --card-bg: rgba(18, 26, 38, 0.75);
            --neon-cyan: #00f2fe;
            --neon-pink: #ff007f;
            --accent-green: #00ff87;
            --text-main: #f0f4f8;
            --text-sub: #8a99ad;
            --border-glow: rgba(0, 242, 254, 0.2);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 242, 254, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(255, 0, 127, 0.05) 0%, transparent 40%);
            background-attachment: fixed;
            padding-bottom: 50px;
        }

        /* Header */
        header {
            background: rgba(7, 9, 14, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-item {
            color: var(--text-sub);
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s;
            cursor: pointer;
        }

        .nav-item:hover, .nav-item.active {
            color: var(--neon-cyan);
            text-shadow: 0 0 8px rgba(0, 242, 254, 0.4);
        }

        .lang-btn {
            background: transparent;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .lang-btn:hover {
            background: var(--neon-cyan);
            color: var(--bg-dark);
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.6);
        }

        /* Container */
        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* Search Section */
        .search-box {
            position: relative;
            margin-bottom: 25px;
        }

        .search-box input {
            width: 100%;
            padding: 15px 20px;
            padding-right: 45px;
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        .search-box input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
        }

        .search-box i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-sub);
        }

        /* Date Navigation Bar */
        .date-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .date-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-sub);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .date-btn:hover, .date-btn.active {
            background: rgba(0, 242, 254, 0.1);
            color: var(--neon-cyan);
            border-color: var(--neon-cyan);
        }

        .date-picker {
            background: var(--bg-dark);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
        }

        /* League Header */
        .league-title {
            background: rgba(255, 255, 255, 0.03);
            border-right: 4px solid var(--neon-cyan);
            padding: 10px 15px;
            margin: 25px 0 15px 0;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
        }

        .league-title img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        /* Match Card */
        .match-card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s, border-color 0.2s;
        }

        .match-card:hover {
            transform: translateY(-2px);
            border-color: var(--border-glow);
        }

        .team {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            font-weight: bold;
        }

        .team.home { justify-content: flex-end; text-align: left; }
        .team.away { justify-content: flex-start; text-align: right; }

        .team img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .score-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 20px;
            min-width: 120px;
        }

        .score {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--neon-cyan);
        }

        .status {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-top: 4px;
        }

        .status.live {
            color: var(--neon-pink);
            font-weight: bold;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .msg-box {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-sub);
            font-size: 1.1rem;
        }

        .err-box {
            text-align: center;
            padding: 40px 20px;
            color: var(--neon-pink);
            font-weight: bold;
            background: rgba(255, 0, 127, 0.05);
            border: 1px solid rgba(255, 0, 127, 0.2);
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="brand">
            <i class="fa-solid fa-gamepad"></i> FT MATCHES
        </a>
        <div class="nav-links">
            <span class="nav-item active" onclick="loadToday()">المباريات</span>
            <span class="nav-item">الأخبار</span>
            <span class="nav-item">الدوريات</span>
            <button class="lang-btn" id="lang-toggle" onclick="toggleLanguage()">العربية</button>
        </div>
    </header>

    <div class="container">
        <!-- Search -->
        <div class="search-box">
            <input type="text" id="team-search" placeholder="ابحث عن فريق (مثل: ريال مدريد، الأهلي)..." onkeyup="handleSearch(event)">
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>

        <!-- Date Navigator -->
        <div class="date-bar">
            <button class="date-btn" onclick="changeDate(-1)">⬅️ الأمس</button>
            <button class="date-btn active" id="btn-today" onclick="loadToday()">🎮 اليوم</button>
            <button class="date-btn" onclick="changeDate(1)">غداً ➡️</button>
            <div>
                <label style="color:var(--text-sub); font-size:0.9rem;">التاريخ: </label>
                <input type="date" id="custom-date" class="date-picker" onchange="onCustomDateSelect(this.value)">
            </div>
        </div>

        <!-- Content Area -->
        <div id="main-content"></div>
    </div>

    <script>
        const API_KEY = "38bc32a76f2aa46d5c07aa8856358c0c"; 
        let currentLang = "ar";
        let currentDate = new Date().toISOString().split('T')[0];

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('custom-date').value = currentDate;
            fetchMatchesForDate(currentDate);
        });

        function toggleLanguage() {
            currentLang = currentLang === "ar" ? "en" : "ar";
            document.getElementById('lang-toggle').innerText = currentLang === "ar" ? "العربية" : "English";
            document.dir = currentLang === "ar" ? "rtl" : "ltr";
            fetchMatchesForDate(currentDate);
        }

        function loadToday() {
            currentDate = new Date().toISOString().split('T')[0];
            document.getElementById('custom-date').value = currentDate;
            fetchMatchesForDate(currentDate);
        }

        function changeDate(days) {
            let d = new Date(currentDate);
            d.setDate(d.getDate() + days);
            currentDate = d.toISOString().split('T')[0];
            document.getElementById('custom-date').value = currentDate;
            fetchMatchesForDate(currentDate);
        }

        function onCustomDateSelect(val) {
            if (val) {
                currentDate = val;
                fetchMatchesForDate(currentDate);
            }
        }

        // ==========================================
        //  نظام الـ Caching الذكي لتوفير طلبات الـ API
        // ==========================================
        async function fetchMatchesForDate(targetDateStr) {
            const container = document.getElementById('main-content');
            
            // مفتاح التخزين المؤقت الخاص بالتاريخ الحالي
            const cacheKey = `ft_matches_${targetDateStr}`;
            const cacheTimeKey = `ft_time_${targetDateStr}`;
            
            const cachedData = localStorage.getItem(cacheKey);
            const cachedTime = localStorage.getItem(cacheTimeKey);
            const now = new Date().getTime();

            // لو البيانات موجودة وممرش عليها أقل من ساعة (3600000 مللي ثانية)، اعرضها بدون طلبات جديدة!
            if (cachedData && cachedTime && (now - cachedTime < 3600000)) {
                console.log("Using Cached Data (0 API requests consumed!)");
                renderMatchGroups(JSON.parse(cachedData), container);
                return;
            }

            const loadingMsg = currentLang === "en" ? "⚡ Loading live fixtures..." : "⚡ جاري تحميل المباريات...";
            container.innerHTML = `<div class="msg-box" style="color: var(--neon-cyan);">${loadingMsg}</div>`;

            try {
                const response = await fetch(`https://v3.football.api-sports.io/fixtures?date=${targetDateStr}`, {
                    method: "GET",
                    headers: {
                        "x-apisports-key": API_KEY,
                        "x-rapidapi-key": API_KEY
                    }
                });

                if (!response.ok) {
                    throw new Error(`Server status: ${response.status}`);
                }

                const result = await response.json();

                if (result.errors && Object.keys(result.errors).length > 0) {
                    throw new Error(JSON.stringify(result.errors));
                }

                if (!result.response || result.response.length === 0) {
                    const emptyMsg = currentLang === "en" ? `🚫 No fixtures on (${targetDateStr}).` : `🚫 لا توجد مباريات مسجلة بتاريخ (${targetDateStr}).`;
                    container.innerHTML = `<div class="msg-box">${emptyMsg}</div>`;
                    return;
                }

                // حفظ النتائج في الـ LocalStorage مع الوقت الحالي
                localStorage.setItem(cacheKey, JSON.stringify(result.response));
                localStorage.setItem(cacheTimeKey, now);

                renderMatchGroups(result.response, container);
            } catch (error) {
                console.error("Fetch Error:", error);
                
                // لو السيرفر جاب إيرور أو كوتا، ولو فيه داتا قديمة مخزنة، اعرضها كخطة بديلة
                if (cachedData) {
                    console.warn("API Error, falling back to old cache.");
                    renderMatchGroups(JSON.parse(cachedData), container);
                    return;
                }

                const errText = currentLang === "en" 
                    ? "⚠️ API limit reached or connection error." 
                    : "⚠️ انتهت الكوتا اليومية أو حدث خطأ في الاتصال.";
                container.innerHTML = `<div class="err-box">${errText}</div>`;
            }
        }

        function renderMatchGroups(fixtures, container) {
            container.innerHTML = "";
            const leagues = {};
            
            fixtures.forEach(item => {
                const leagueName = item.league.name;
                if (!leagues[leagueName]) {
                    leagues[leagueName] = {
                        logo: item.league.logo,
                        matches: []
                    };
                }
                leagues[leagueName].matches.push(item);
            });

            for (const [name, data] of Object.entries(leagues)) {
                let html = `
                    <div class="league-title">
                        <img src="${data.logo || ''}" alt="">
                        <span>${name}</span>
                    </div>
                `;

                data.matches.forEach(m => {
                    const statusShort = m.fixture.status.short;
                    let statusText = m.fixture.status.elapsed ? `${m.fixture.status.elapsed}'` : statusShort;
                    let isLive = ["1H", "HT", "2H", "ET", "P"].includes(statusShort);
                    let time = new Date(m.fixture.date).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                    html += `
                        <div class="match-card">
                            <div class="team home">
                                <span>${m.teams.home.name}</span>
                                <img src="${m.teams.home.logo}" alt="">
                            </div>
                            <div class="score-info">
                                <div class="score">
                                    ${m.goals.home ?? '-'} : ${m.goals.away ?? '-'}
                                </div>
                                <div class="status ${isLive ? 'live' : ''}">
                                    ${isLive ? '🔴 ' + statusText : time}
                                </div>
                            </div>
                            <div class="team away">
                                <img src="${m.teams.away.logo}" alt="">
                                <span>${m.teams.away.name}</span>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML += html;
            }
        }

        function handleSearch(event) {
            const query = event.target.value.toLowerCase().trim();
            const cards = document.querySelectorAll('.match-card');
            cards.forEach(card => {
                const text = card.innerText.toLowerCase();
                card.style.display = text.includes(query) ? 'flex' : 'none';
            });
        }
    </script>
</body>
</html>
