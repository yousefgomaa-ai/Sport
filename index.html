<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مواعيد المباريات - FT</title>
    <style>
        :root {
            --bg-color: #0b1117;
            --card-bg: #121d28;
            --neon-green: #00ffaa;
            --neon-cyan: #00e5ff;
            --border-color: #1a2c3d;
            --text-color: #ffffff;
            --sub-text: #7f99b2;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            direction: rtl;
        }

        /* شريط الملاحة العلوي */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: #090e13;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 1.5rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
        }

        nav a {
            color: var(--sub-text);
            text-decoration: none;
            margin: 0 15px;
            font-size: 1rem;
            transition: 0.3s;
        }

        nav a.active, nav a:hover {
            color: var(--neon-cyan);
            border-bottom: 2px solid var(--neon-cyan);
            padding-bottom: 5px;
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.5);
        }

        /* الحاوية الرئيسية */
        .layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
            max-width: 1300px;
            margin: 20px auto;
            padding: 0 20px;
        }

        /* القائمة الجانبية (أهم الدوريات) */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px;
            background: var(--card-bg);
            border: 1px solid var(--neon-cyan);
            border-radius: 8px;
            color: #fff;
            box-shadow: 0 0 8px rgba(0, 229, 255, 0.2);
            box-sizing: border-box;
        }

        .sidebar-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin: 15px 0 10px;
            color: var(--text-color);
        }

        .sidebar-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 12px 15px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.3s;
        }

        .sidebar-item:hover {
            border-color: var(--neon-green);
            box-shadow: 0 0 10px rgba(0, 255, 170, 0.2);
        }

        .sidebar-item img {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        /* المنطقة الرئيسية لجدول المباريات */
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 12px 20px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .page-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--text-color);
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
        }

        .filter-tabs {
            display: flex;
            gap: 10px;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--sub-text);
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
        }

        .tab-btn.active {
            background: rgba(0, 255, 170, 0.1);
            border-color: var(--neon-green);
            color: var(--neon-green);
            font-weight: bold;
            box-shadow: 0 0 8px rgba(0, 255, 170, 0.3);
        }

        /* قسم البطولة */
        .league-group {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .league-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--neon-green);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .league-title img {
            width: 25px;
            height: 25px;
            object-fit: contain;
        }

        /* كارت المباراة - تصميم النيون */
        .match-card {
            display: grid;
            grid-template-columns: 1fr 140px 1fr;
            align-items: center;
            background: #0d151e;
            border: 1px solid #1a2736;
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 10px;
            transition: 0.3s;
        }

        .match-card:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.25);
        }

        .team {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
        }

        .team.home { justify-content: flex-start; }
        .team.away { justify-content: flex-end; }

        .team img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .match-center {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .badge-status {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
        }

        .badge-live {
            background: #ff0055;
            color: #fff;
            box-shadow: 0 0 8px rgba(255, 0, 85, 0.6);
        }

        .badge-ns {
            background: rgba(0, 229, 255, 0.1);
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
        }

        .match-score {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--neon-green);
            text-shadow: 0 0 6px rgba(0, 255, 170, 0.4);
        }

        .match-time {
            font-size: 0.8rem;
            color: var(--sub-text);
        }

        @media (max-width: 850px) {
            .layout { grid-template-columns: 1fr; }
            .sidebar { display: none; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">⚽ FT Matches</div>
    <nav>
        <a href="#" class="active">الرئيسية</a>
        <a href="#">البطولات</a>
        <a href="#">الفرق</a>
        <a href="#">الأخبار</a>
        <a href="#">لايف</a>
    </nav>
</header>

<div class="layout">
    <!-- الشريط الجانبي لأهم الدوريات -->
    <div class="sidebar">
        <div class="search-box">
            <input type="text" placeholder="بحث عن بطولة أو فريق...">
        </div>
        <div class="sidebar-title">أهم الدوريات</div>
        <div class="sidebar-item">
            <span>🇪🇬 الدوري المصري الممتاز</span>
        </div>
        <div class="sidebar-item">
            <span>🏴󠁧󠁢󠁥󠁮󠁧󠁢🏴 الدوري الإنجليزي</span>
        </div>
        <div class="sidebar-item">
            <span>🇪🇸 الدوري الإسباني</span>
        </div>
        <div class="sidebar-item">
            <span>🏆 دوري أبطال إفريقيا</span>
        </div>
        <div class="sidebar-item">
            <span>🇪🇺 دوري أبطال أوروبا</span>
        </div>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="main-content">
        <div class="top-bar">
            <div class="page-title">مواعيد مباريات اليوم وغداً</div>
            <div class="filter-tabs">
                <button class="tab-btn active">اليوم</button>
                <button class="tab-btn">غداً</button>
            </div>
        </div>

        <div id="matches-container">
            <div style="text-align: center; color: var(--sub-text); padding: 40px;">⏳ جاري جلب أحدث المباريات وترتيبها...</div>
        </div>
    </div>
</div>

<script>
    const API_KEY = "Ed109aa442ff91b5c24d8f72cbcd23d2";
    const today = new Date().toISOString().split('T')[0];

    // ترتيب أولوية البطولات (المصري محلياً، ثم الإنجليزي، ثم الإسباني، ثم الأفريقي، والأوروبي، والآسيوي)
    function getLeaguePriority(leagueName) {
        const name = leagueName.toLowerCase();
        
        // 1. البطولات المصرية المحلية
        if (name.includes('egypt') || name.includes('مصر')) return 1;
        
        // 2. الدوري الإنجليزي
        if (name.includes('premier league') || name.includes('إنجلترا')) return 2;
        
        // 3. الدوري الإسباني
        if (name.includes('la liga') || name.includes('إسبانيا')) return 3;
        
        // 4. البطولات الأفريقية
        if (name.includes('caf') || name.includes('africa')) return 4;
        
        // 5. البطولات الأوروبية (دوري الأبطال / الدوري الأوروبي)
        if (name.includes('uefa') || name.includes('champions league') || name.includes('europa')) return 5;
        
        // 6. البطولات الآسيوية
        if (name.includes('afc') || name.includes('asia')) return 6;
        
        // 7. باقي الدوريات والبطولات
        return 99;
    }

    async function loadMatches() {
        const container = document.getElementById('matches-container');

        try {
            const response = await fetch(`https://v3.football.api-sports.io/fixtures?date=${today}`, {
                method: "GET",
                headers: {
                    "x-rapidapi-host": "v3.football.api-sports.io",
                    "x-rapidapi-key": API_KEY
                }
            });

            const result = await response.json();

            if (!result.response || result.response.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:30px; color:var(--sub-text);">لا توجد مباريات جارية اليوم.</div>';
                return;
            }

            // تجميع وتصنيف المباريات حسب البطولة
            const grouped = {};
            result.response.forEach(item => {
                const leagueName = item.league.name;
                if (!grouped[leagueName]) {
                    grouped[leagueName] = {
                        name: leagueName,
                        country: item.league.country,
                        logo: item.league.logo,
                        priority: getLeaguePriority(leagueName),
                        matches: []
                    };
                }

                const matchTime = new Date(item.fixture.date).toLocaleTimeString('ar-EG', {
                    hour: '2-digit', minute: '2-digit'
                });

                let statusBadge = `<span class="badge-status badge-ns">لم تبدأ</span>`;
                if (['1H', '2H', 'HT'].includes(item.fixture.status.short)) {
                    statusBadge = `<span class="badge-status badge-live">🔴 LIVE ${item.fixture.status.elapsed}'</span>`;
                } else if (item.fixture.status.short === 'FT') {
                    statusBadge = `<span class="badge-status" style="background:#334155;">انتهت</span>`;
                }

                grouped[leagueName].matches.push({
                    homeTeam: item.teams.home.name,
                    homeLogo: item.teams.home.logo,
                    awayTeam: item.teams.away.name,
                    awayLogo: item.teams.away.logo,
                    scoreHome: item.goals.home ?? '-',
                    scoreAway: item.goals.away ?? '-',
                    time: matchTime,
                    statusBadge: statusBadge
                });
            });

            // تحويل إلى مصفوفة وترتيب البطولات حسب الأولويات المطلوبة
            const sortedLeagues = Object.values(grouped).sort((a, b) => a.priority - b.priority);

            // طباعة المباريات مقسمة بالبطولات
            container.innerHTML = '';
            sortedLeagues.forEach(league => {
                const section = document.createElement('div');
                section.className = 'league-group';

                const matchesHTML = league.matches.map(m => `
                    <div class="match-card">
                        <div class="team home">
                            <img src="${m.homeLogo}" alt="${m.homeTeam}">
                            <span>${m.homeTeam}</span>
                        </div>
                        <div class="match-center">
                            ${m.statusBadge}
                            <div class="match-score">${m.scoreHome} - ${m.scoreAway}</div>
                            <div class="match-time">⏰ ${m.time}</div>
                        </div>
                        <div class="team away">
                            <span>${m.awayTeam}</span>
                            <img src="${m.awayLogo}" alt="${m.awayTeam}">
                        </div>
                    </div>
                `).join('');

                section.innerHTML = `
                    <div class="league-title">
                        <img src="${league.logo}" alt="${league.name}">
                        <span>🏆 ${league.name} (${league.country})</span>
                    </div>
                    ${matchesHTML}
                `;
                container.appendChild(section);
            });

        } catch (error) {
            container.innerHTML = '<div style="text-align:center; color:#ff4444; padding:30px;">حدث خطأ في تحميل المباريات. تأكد من مفتاح الـ API.</div>';
            console.error(error);
        }
    }

    loadMatches();
</script>

</body>
</html>
